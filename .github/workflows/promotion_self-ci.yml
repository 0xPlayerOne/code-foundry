name: Code Foundry

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read
  security-events: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: ${{ github.sha }}
      runner: ubuntu-latest
    secrets: inherit

  test:
    name: Test
    uses: ./.github/workflows/test.yml
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: ${{ github.sha }}
      runner: ubuntu-latest
      unit-runner: ubuntu-slim
    secrets: inherit

  security:
    name: Security
    uses: ./.github/workflows/security.yml
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: ${{ github.sha }}
      runner: ubuntu-slim
    secrets: inherit

  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: ${{ github.sha }}
      runner: ubuntu-latest
    secrets: inherit

  release-pr:
    name: Release PR / Create
    runs-on: ubuntu-slim
    steps:
      - name: Validate promotion
        run: echo 'Main promotion validation is handled by this workflow; version release remains a post-merge action.'
