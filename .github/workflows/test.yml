name: Test

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-slim
    outputs:
      unit: ${{ steps.suites.outputs.unit }}
      integration: ${{ steps.suites.outputs.integration }}
      e2e: ${{ steps.suites.outputs.e2e }}
      smoke: ${{ steps.suites.outputs.smoke }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect suites
        id: suites
        shell: bash
        run: |
          for task in unit integration e2e smoke; do
            applicable="$(bash .github/scripts/ci.sh should_run "$task" | awk -F= '$1 == "applicable" { print $2 }')"
            printf '%s=%s\n' "$task" "$applicable" >> "$GITHUB_OUTPUT"
          done

  unit:
    name: Unit
    needs: detect
    if: needs.detect.outputs.unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          install: true
      - name: Unit
        run: bash .github/scripts/ci.sh unit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ github.run_id }}
          path: |
            coverage/**
            htmlcov/**
            .coverage*
            target/llvm-cov/**
          compression-level: 1
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Integration
    needs: detect
    if: needs.detect.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          install: true
      - name: Integration
        run: bash .github/scripts/ci.sh integration

  e2e:
    name: E2E
    needs: detect
    if: needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          install: true
      - name: E2E
        run: bash .github/scripts/ci.sh e2e

  smoke:
    name: Smoke
    needs: detect
    if: needs.detect.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          install: true
      - name: Smoke
        run: bash .github/scripts/ci.sh smoke
