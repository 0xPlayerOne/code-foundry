name: Test

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect
        id: applicability
        run: bash .github/scripts/ci.sh should_run unit >> "$GITHUB_OUTPUT"
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true'
        uses: ./.github/actions/setup
        with:
          install: true
      - name: Unit
        if: steps.applicability.outputs.applicable == 'true'
        run: bash .github/scripts/ci.sh unit
      - name: Upload coverage
        if: always() && steps.applicability.outputs.applicable == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ github.run_id }}
          path: |
            coverage/**
            htmlcov/**
            .coverage*
            target/llvm-cov/**
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect
        id: applicability
        run: bash .github/scripts/ci.sh should_run integration >> "$GITHUB_OUTPUT"
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true'
        uses: ./.github/actions/setup
        with:
          install: true
      - name: Integration
        if: steps.applicability.outputs.applicable == 'true'
        run: bash .github/scripts/ci.sh integration

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect
        id: applicability
        run: bash .github/scripts/ci.sh should_run e2e >> "$GITHUB_OUTPUT"
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true'
        uses: ./.github/actions/setup
        with:
          install: true
      - name: E2E
        if: steps.applicability.outputs.applicable == 'true'
        run: bash .github/scripts/ci.sh e2e

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect
        id: applicability
        run: bash .github/scripts/ci.sh should_run smoke >> "$GITHUB_OUTPUT"
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true'
        uses: ./.github/actions/setup
        with:
          install: true
      - name: Smoke
        if: steps.applicability.outputs.applicable == 'true'
        run: bash .github/scripts/ci.sh smoke
