name: Test

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  REPO_FOUNDRY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-profile:
    name: Test Profile
    runs-on: ubuntu-slim
    outputs:
      e2e: ${{ steps.profile.outputs.e2e }}
      e2e_browser: ${{ steps.profile.outputs.e2e_browser }}
      smoke: ${{ steps.profile.outputs.smoke }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: blob:none
      - name: Detect
        id: profile
        run: bash .github/scripts/ci.sh profile_test_optional >> "$GITHUB_OUTPUT"

  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect
        id: applicability
        run: bash .github/scripts/ci.sh should_run unit >> "$GITHUB_OUTPUT"
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true'
        uses: ./.github/actions/setup
        with:
          install: true
          cache-build: false
      - name: Unit
        if: steps.applicability.outputs.applicable == 'true'
        run: bash .github/scripts/ci.sh unit
      - name: Upload coverage
        if: >-
          always() &&
          steps.applicability.outputs.applicable == 'true' &&
          hashFiles('coverage/**', 'htmlcov/**', '.coverage*', 'target/llvm-cov/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ github.run_id }}
          path: |
            coverage/**
            htmlcov/**
            .coverage*
            target/llvm-cov/**
          compression-level: 1
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect
        id: applicability
        run: bash .github/scripts/ci.sh should_run integration >> "$GITHUB_OUTPUT"
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true'
        uses: ./.github/actions/setup
        with:
          install: true
          cache-build: false
      - name: Integration
        if: steps.applicability.outputs.applicable == 'true'
        run: bash .github/scripts/ci.sh integration

  e2e:
    name: E2E
    needs: test-profile
    runs-on: ${{ needs.test-profile.outputs.e2e == 'true' && 'ubuntu-latest' || 'ubuntu-slim' }}
    steps:
      - name: Checkout
        if: needs.test-profile.outputs.e2e == 'true'
        uses: actions/checkout@v7
      - name: Cache browser binaries
        if: needs.test-profile.outputs.e2e == 'true' && needs.test-profile.outputs.e2e_browser == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/Cypress
            ~/.cache/puppeteer
          key: ${{ runner.os }}-e2e-browsers-${{ hashFiles('**/package.json', '**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json', '**/playwright.config.*', '**/cypress.config.*') }}
          restore-keys: |
            ${{ runner.os }}-e2e-browsers-
      - name: Setup
        if: needs.test-profile.outputs.e2e == 'true'
        uses: ./.github/actions/setup
        with:
          install: true
          cache-build: false
      - name: E2E
        if: needs.test-profile.outputs.e2e == 'true'
        run: bash .github/scripts/ci.sh e2e

  smoke:
    name: Smoke
    needs: test-profile
    runs-on: ${{ needs.test-profile.outputs.smoke == 'true' && 'ubuntu-latest' || 'ubuntu-slim' }}
    steps:
      - name: Checkout
        if: needs.test-profile.outputs.smoke == 'true'
        uses: actions/checkout@v7
      - name: Setup
        if: needs.test-profile.outputs.smoke == 'true'
        uses: ./.github/actions/setup
        with:
          install: true
          cache-build: false
      - name: Smoke
        if: needs.test-profile.outputs.smoke == 'true'
        run: bash .github/scripts/ci.sh smoke
