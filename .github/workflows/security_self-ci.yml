name: Code Foundry

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: ${{ github.sha }}
      runner: ubuntu-slim
    secrets: inherit
