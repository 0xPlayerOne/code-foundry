name: Code Foundry CI

on:
  workflow_call:
    inputs:
      runtime-repository:
        description: Repository containing the Code Foundry runtime.
        required: false
        type: string
        default: 0xPlayerOne/code-foundry
      runtime-ref:
        description: Code Foundry runtime tag or ref.
        required: false
        type: string
        default: v1.0.5
      runner:
        description: Runner used by CI jobs.
        required: false
        type: string
        default: ubuntu-latest
      artifact-prefix:
        description: Prefix for task receipts; use a unique value when calling this workflow more than once.
        required: false
        type: string
        default: task-result
      release-build-only:
        description: Run only the build lane after an exact successful source qualification receipt.
        required: false
        type: boolean
        default: false
      release-package-check:
        description: Inspect the versioned npm package contents on release pull requests.
        required: false
        type: boolean
        default: false
    secrets:
      TURBO_TOKEN:
        required: false
      NEXTAUTH_SECRET:
        required: false

permissions:
  contents: read

env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  REPO_FOUNDRY_PROFILE: ${{ vars.REPO_FOUNDRY_PROFILE }}
  REPO_FOUNDRY_LANGUAGES: ${{ vars.REPO_FOUNDRY_LANGUAGES }}
  REPO_FOUNDRY_FEATURES: ${{ vars.REPO_FOUNDRY_FEATURES }}
  REPO_FOUNDRY_PACKAGE_MANAGER: ${{ vars.REPO_FOUNDRY_PACKAGE_MANAGER }}
  REPO_FOUNDRY_RUNNER: ${{ vars.REPO_FOUNDRY_RUNNER }}
  REPO_FOUNDRY_CACHE_PACKAGES: ${{ vars.REPO_FOUNDRY_CACHE_PACKAGES || 'auto' }}
  REPO_FOUNDRY_CACHE_BUILD: ${{ vars.REPO_FOUNDRY_CACHE_BUILD || 'auto' }}
  REPO_FOUNDRY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}

concurrency:
  group: code-foundry-ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  # Superseded pull-request runs are cancelled so the newest head owns the
  # group; push and scheduled runs queue instead, because cancelling a main
  # push can drop default-branch analysis or release-adjacent work.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format
    if: vars.CI_BILLING_PAUSED != 'true' && inputs.release-build-only != true
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions
            src/lib
            src/runtime-core.mjs
            src/runtime.mjs
      - name: Install runtime
        run: |
          mkdir -p .github/actions
          mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
          cp -R "$RUNNER_TEMP/code-foundry/.github/actions/." .github/actions/
      - name: Detect
        id: applicability
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node "$RUNNER_TEMP/code-foundry/src/runtime.mjs" ci should_run format >> "$GITHUB_OUTPUT"
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true' && steps.applicability.outputs.affected != 'false'
        uses: ./.github/actions/setup
        with:
          # Repository format scripts normally call a project-local formatter
          # (for example, Oxfmt). Install dependencies before running them;
          # otherwise a clean runner cannot resolve the declared tool.
          install: 'true'
          cache-format: 'true'
          cache-lint: 'false'
          cache-build: 'false'
          task: format
      - name: Format
        id: execute
        if: steps.applicability.outputs.applicable == 'true' && steps.applicability.outputs.affected != 'false'
        run: node "$RUNNER_TEMP/code-foundry/src/runtime.mjs" ci format
      - name: Retain task receipt
        if: >-
          always() &&
          (steps.execute.outcome == 'success' || steps.execute.outcome == 'failure' ||
          steps.applicability.outputs.applicable == 'false' || steps.applicability.outputs.affected == 'false') &&
          hashFiles('.code-foundry/results/format.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-format
          path: .code-foundry/results/format.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Save Vite+ task cache
        uses: ./.github/actions/vite-plus-cache-save

  lint:
    name: Lint
    if: vars.CI_BILLING_PAUSED != 'true' && inputs.release-build-only != true
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions
            src/lib
            src/runtime-core.mjs
            src/runtime.mjs
      - name: Install runtime
        run: |
          mkdir -p .github/actions
          mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
          cp -R "$RUNNER_TEMP/code-foundry/.github/actions/." .github/actions/
      - name: Detect
        id: applicability
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node "$RUNNER_TEMP/code-foundry/src/runtime.mjs" ci should_run lint >> "$GITHUB_OUTPUT"
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true' && steps.applicability.outputs.affected != 'false'
        uses: ./.github/actions/setup
        with:
          install: 'true'
          cache-lint: 'true'
          task: lint
      - name: Lint
        id: execute
        if: steps.applicability.outputs.applicable == 'true' && steps.applicability.outputs.affected != 'false'
        run: node "$RUNNER_TEMP/code-foundry/src/runtime.mjs" ci lint
      - name: Retain task receipt
        if: >-
          always() &&
          (steps.execute.outcome == 'success' || steps.execute.outcome == 'failure' ||
          steps.applicability.outputs.applicable == 'false' || steps.applicability.outputs.affected == 'false') &&
          hashFiles('.code-foundry/results/lint.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-lint
          path: .code-foundry/results/lint.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Save Vite+ task cache
        uses: ./.github/actions/vite-plus-cache-save

  type-check:
    name: Type-Check
    if: vars.CI_BILLING_PAUSED != 'true' && inputs.release-build-only != true
    permissions:
      contents: read
      issues: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions
            src/lib
            src/runtime-core.mjs
            src/runtime.mjs
      - name: Install runtime
        run: |
          mkdir -p .github/actions
          mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
          cp -R "$RUNNER_TEMP/code-foundry/.github/actions/." .github/actions/
      - name: Detect
        id: applicability
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node "$RUNNER_TEMP/code-foundry/src/runtime.mjs" ci should_run type_check >> "$GITHUB_OUTPUT"
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true' && steps.applicability.outputs.affected != 'false'
        uses: ./.github/actions/setup
        with:
          install: 'true'
          cache-build: 'true'
          task: type_check
      - name: Type-Check
        id: execute
        if: steps.applicability.outputs.applicable == 'true' && steps.applicability.outputs.affected != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/code-foundry/src/runtime.mjs" ci type_check
      - name: Retain task receipt
        if: >-
          always() &&
          (steps.execute.outcome == 'success' || steps.execute.outcome == 'failure' ||
          steps.applicability.outputs.applicable == 'false' || steps.applicability.outputs.affected == 'false') &&
          hashFiles('.code-foundry/results/type_check.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-type_check
          path: .code-foundry/results/type_check.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Save Vite+ task cache
        uses: ./.github/actions/vite-plus-cache-save

  build:
    name: Build
    if: vars.CI_BILLING_PAUSED != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      # Framework builds may validate server-side configuration at build time.
      # Consumers can provide the real value; the fallback is intentionally
      # CI-only and must never be used at runtime.
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'code-foundry-ci-placeholder-0123456789' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions
            src/lib
            src/runtime-core.mjs
            src/runtime.mjs
      - name: Install runtime
        run: |
          mkdir -p .github/actions
          mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
          cp -R "$RUNNER_TEMP/code-foundry/.github/actions/." .github/actions/
      - name: Set up Node.js 24.18.0 for package inspection
        if: inputs.release-package-check == true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Detect
        id: applicability
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node "$RUNNER_TEMP/code-foundry/src/runtime.mjs" ci should_run build >> "$GITHUB_OUTPUT"
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true' && steps.applicability.outputs.affected != 'false'
        uses: ./.github/actions/setup
        with:
          install: 'true'
          cache-build: 'true'
          task: build
      - name: Build
        id: execute
        if: steps.applicability.outputs.applicable == 'true' && steps.applicability.outputs.affected != 'false'
        run: node "$RUNNER_TEMP/code-foundry/src/runtime.mjs" ci build
      - name: Inspect versioned npm package contents
        if: inputs.release-package-check == true && hashFiles('package.json') != ''
        run: |
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/foundry-package-inspection.json"
          node -e 'const fs = require("node:fs"); const manifest = JSON.parse(fs.readFileSync("package.json", "utf8")); const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!Array.isArray(result) || result.length !== 1 || result[0]?.name !== manifest.name || result[0]?.version !== manifest.version || !result[0]?.files?.some((file) => file.path === "package.json")) process.exit(1)' "$RUNNER_TEMP/foundry-package-inspection.json"
      - name: Retain task receipt
        if: >-
          always() &&
          (steps.execute.outcome == 'success' || steps.execute.outcome == 'failure' ||
          steps.applicability.outputs.applicable == 'false' || steps.applicability.outputs.affected == 'false') &&
          hashFiles('.code-foundry/results/build.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          path: .code-foundry/results/build.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Save Vite+ task cache
        uses: ./.github/actions/vite-plus-cache-save
