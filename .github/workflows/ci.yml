name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Install dependencies
        run: bash .github/scripts/ci.sh install
      - name: Quality checks
        run: bash .github/scripts/ci.sh quality

  test:
    name: Tests and coverage
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Install dependencies
        run: bash .github/scripts/ci.sh install
      - name: Tests and coverage
        run: bash .github/scripts/ci.sh test
