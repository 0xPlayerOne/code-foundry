name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-slim
    outputs:
      format: ${{ steps.suites.outputs.format }}
      lint: ${{ steps.suites.outputs.lint }}
      type_check: ${{ steps.suites.outputs.type_check }}
      build: ${{ steps.suites.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect suites
        id: suites
        shell: bash
        run: |
          for task in format lint type_check build; do
            applicable="$(bash .github/scripts/ci.sh should_run "$task" | awk -F= '$1 == "applicable" { print $2 }')"
            printf '%s=%s\n' "$task" "$applicable" >> "$GITHUB_OUTPUT"
          done

  format:
    name: Format
    needs: detect
    if: needs.detect.outputs.format == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          install: true
      - name: Format
        run: bash .github/scripts/ci.sh format

  lint:
    name: Lint
    needs: detect
    if: needs.detect.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          install: true
      - name: Lint
        run: bash .github/scripts/ci.sh lint

  type-check:
    name: Type-Check
    needs: detect
    if: needs.detect.outputs.type_check == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          install: true
      - name: Type-Check
        run: bash .github/scripts/ci.sh type_check

  build:
    name: Build
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          install: true
      - name: Build
        run: bash .github/scripts/ci.sh build
