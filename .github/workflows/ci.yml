name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect
        id: applicability
        run: bash .github/scripts/ci.sh should_run format
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true'
        uses: ./.github/actions/setup
        with:
          install: true
      - name: Format
        if: steps.applicability.outputs.applicable == 'true'
        run: bash .github/scripts/ci.sh format

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect
        id: applicability
        run: bash .github/scripts/ci.sh should_run lint
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true'
        uses: ./.github/actions/setup
        with:
          install: true
      - name: Lint
        if: steps.applicability.outputs.applicable == 'true'
        run: bash .github/scripts/ci.sh lint

  type-check:
    name: Type-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect
        id: applicability
        run: bash .github/scripts/ci.sh should_run type_check
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true'
        uses: ./.github/actions/setup
        with:
          install: true
      - name: Type-Check
        if: steps.applicability.outputs.applicable == 'true'
        run: bash .github/scripts/ci.sh type_check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect
        id: applicability
        run: bash .github/scripts/ci.sh should_run build
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true'
        uses: ./.github/actions/setup
        with:
          install: true
      - name: Build
        if: steps.applicability.outputs.applicable == 'true'
        run: bash .github/scripts/ci.sh build
