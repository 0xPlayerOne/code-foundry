name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: staging
      runner: ubuntu-latest
    secrets: inherit
