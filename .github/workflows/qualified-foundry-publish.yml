name: Qualified Foundry Publication

on:
  workflow_call:
    inputs:
      tag:
        description: Published immutable release tag at the caller commit.
        required: true
        type: string
      asset:
        description: Exact pre-attached Code Foundry npm tarball name.
        required: true
        type: string
      billing-pause-bypass:
        description: Allow only an explicitly dispatched release while shared CI remains paused.
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  attestations: read
  contents: read

jobs:
  qualify:
    name: Qualify Node ${{ matrix.node }}
    if: (vars.CI_BILLING_PAUSED != 'true' || (github.event_name == 'workflow_dispatch' && inputs['billing-pause-bypass'] == true)) && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - name: Checkout trusted qualification runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned Actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Download and cryptographically verify the release archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ASSET: ${{ inputs.asset }}
        run: |
          set -euo pipefail
          node src/commands/qualified-publication.mjs download \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$GITHUB_SHA" "$RELEASE_ASSET" \
            "$RUNNER_TEMP/candidate" > "$RUNNER_TEMP/download.json"
      - name: Qualify those exact bytes
        env:
          RELEASE_ASSET: ${{ inputs.asset }}
        run: |
          set -euo pipefail
          node src/lib/consumer-qualification.mjs \
            "$RUNNER_TEMP/candidate/$RELEASE_ASSET" "$GITHUB_SHA" \
            "$RUNNER_TEMP/report.json" "$(go env GOPATH)/bin/actionlint"
      - name: Retain this attempt's qualification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualified-${{ github.run_attempt }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/report.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish qualified archive
    needs: qualify
    if: (vars.CI_BILLING_PAUSED != 'true' || (github.event_name == 'workflow_dispatch' && inputs['billing-pause-bypass'] == true)) && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: qualified-foundry-npm-${{ github.repository }}-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_ASSET: ${{ inputs.asset }}
    steps:
      - name: Checkout trusted publication runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup Node for trusted publishing
        if: env.HAS_NPM_TOKEN != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Setup Node for token publishing
        if: env.HAS_NPM_TOKEN == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Retrieve only this run attempt's evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for node in 24 26; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "qualified-$GITHUB_RUN_ATTEMPT-node-$node" \
              --dir "$RUNNER_TEMP/reports/$node"
          done
          node src/commands/qualified-publication.mjs download \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$GITHUB_SHA" "$RELEASE_ASSET" \
            "$RUNNER_TEMP/candidate" > "$RUNNER_TEMP/download.json"
      - name: Reverify and publish the tested tarball without lifecycle hooks
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node src/commands/qualified-publication.mjs publish \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$GITHUB_SHA" "$RELEASE_ASSET" \
            "$RUNNER_TEMP/candidate" \
            "$RUNNER_TEMP/reports/24/report.json" \
            "$RUNNER_TEMP/reports/24/report.json" \
            "$RUNNER_TEMP/reports/24/report.json" > "$RUNNER_TEMP/publication.json"
      - name: Retain publication identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualified-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: warn
          retention-days: 14
