name: Consumer Qualification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qualify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned workflow validator
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Pack and qualify the exact distributable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/qualification" > "$RUNNER_TEMP/qualification/pack.json"
          PACKAGE=$(node -e 'const p=require(process.argv[1]); if(p.length!==1 || !/^[A-Za-z0-9._-]+\.tgz$/.test(p[0].filename)) process.exit(1); console.log(p[0].filename)' "$RUNNER_TEMP/qualification/pack.json")
          node src/lib/consumer-qualification.mjs \
            "$RUNNER_TEMP/qualification/$PACKAGE" \
            "$(git rev-parse HEAD)" \
            "$RUNNER_TEMP/qualification/report.json" \
            "$(go env GOPATH)/bin/actionlint"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consumer-qualification-node-${{ matrix.node }}
          path: ${{ runner.temp }}/qualification/*.json
          if-no-files-found: warn
          retention-days: 14
