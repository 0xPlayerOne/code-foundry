name: Security

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_FOUNDRY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Profile
    runs-on: ubuntu-slim
    outputs:
      javascript: ${{ steps.profile.outputs.javascript }}
      rust: ${{ steps.profile.outputs.rust }}
      python: ${{ steps.profile.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github
            .npmrc
            .pnpmfile.cjs
            .yarnrc*
            **/package.json
            **/bun.lock
            **/bun.lockb
            **/pnpm-lock.yaml
            **/yarn.lock
            **/package-lock.json
            **/Cargo.toml
            **/Cargo.lock
            **/.cargo/**
            **/pyproject.toml
            **/requirements*.txt
            **/setup.py
            **/setup.cfg
            **/Pipfile
            **/Pipfile.lock
            **/poetry.lock
            **/uv.lock
          sparse-checkout-cone-mode: false
      - name: Detect
        id: profile
        run: bash .github/scripts/security.sh profile >> "$GITHUB_OUTPUT"

  dependency-audit:
    name: Dependency Audit (${{ matrix.name }})
    needs: profile
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JavaScript
            ecosystem: javascript
          - name: Rust
            ecosystem: rust
          - name: Python
            ecosystem: python
    steps:
      - name: Check
        id: applicability
        env:
          ECOSYSTEM: ${{ matrix.ecosystem }}
          JAVASCRIPT: ${{ needs.profile.outputs.javascript }}
          RUST: ${{ needs.profile.outputs.rust }}
          PYTHON: ${{ needs.profile.outputs.python }}
        run: |
          case "$ECOSYSTEM" in
            javascript) applicable="$JAVASCRIPT" ;;
            rust) applicable="$RUST" ;;
            python) applicable="$PYTHON" ;;
            *) echo "Unknown ecosystem: $ECOSYSTEM" >&2; exit 2 ;;
          esac
          printf 'applicable=%s\n' "$applicable" >> "$GITHUB_OUTPUT"
      - name: Checkout
        if: steps.applicability.outputs.applicable == 'true'
        uses: actions/checkout@v7
        with:
          # Dependency audits only need manifests and lockfiles; defer source
          # blob transfer until a tool explicitly reads a required file.
          filter: blob:none
          sparse-checkout: |
            .github
            .npmrc
            .pnpmfile.cjs
            .yarnrc*
            **/package.json
            **/bun.lock
            **/bun.lockb
            **/pnpm-lock.yaml
            **/yarn.lock
            **/package-lock.json
            **/Cargo.toml
            **/Cargo.lock
            **/.cargo/**
            **/pyproject.toml
            **/requirements*.txt
            **/setup.py
            **/setup.cfg
            **/Pipfile
            **/Pipfile.lock
            **/poetry.lock
            **/uv.lock
          sparse-checkout-cone-mode: false
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true'
        uses: ./.github/actions/setup
        with:
          mise-scope: ${{ matrix.ecosystem }}
      - name: Audit dependencies
        if: steps.applicability.outputs.applicable == 'true'
        run: bash .github/scripts/security.sh audit "${{ matrix.ecosystem }}"

  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-slim
    steps:
      - name: Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          license-check: true
