name: Code Foundry Security

on:
  workflow_call:
    inputs:
      runtime-repository:
        description: Repository containing the Code Foundry runtime.
        required: false
        type: string
        default: 0xPlayerOne/code-foundry
      runtime-ref:
        description: Code Foundry runtime tag or ref.
        required: false
        type: string
        default: v0.31.12
      runner:
        description: Runner used by Security jobs.
        required: false
        type: string
        default: ubuntu-slim
permissions:
  contents: read

env:
  REPO_FOUNDRY_PROFILE: ${{ vars.REPO_FOUNDRY_PROFILE }}
  REPO_FOUNDRY_LANGUAGES: ${{ vars.REPO_FOUNDRY_LANGUAGES }}
  REPO_FOUNDRY_FEATURES: ${{ vars.REPO_FOUNDRY_FEATURES }}
  REPO_FOUNDRY_PACKAGE_MANAGER: ${{ vars.REPO_FOUNDRY_PACKAGE_MANAGER }}
  REPO_FOUNDRY_CACHE_PACKAGES: ${{ vars.REPO_FOUNDRY_CACHE_PACKAGES || 'auto' }}
  REPO_FOUNDRY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}

concurrency:
  group: code-foundry-security-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  profile:
    name: Profile
    if: vars.CI_BILLING_PAUSED != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      javascript: ${{ steps.profile.outputs.javascript }}
      rust: ${{ steps.profile.outputs.rust }}
      python: ${{ steps.profile.outputs.python }}
      python_requirements: ${{ steps.profile.outputs.python_requirements }}
      dependency_review: ${{ steps.profile.outputs.dependency_review }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github
            .mise.toml
            mise.lock
            .npmrc
            .pnpmfile.cjs
            .yarnrc*
            **/package.json
            **/bun.lock
            **/bun.lockb
            **/pnpm-lock.yaml
            **/yarn.lock
            **/package-lock.json
            **/Cargo.toml
            **/Cargo.lock
            **/.cargo/**
            **/pyproject.toml
            **/requirements*.txt
            **/setup.py
            **/setup.cfg
            **/Pipfile
            **/Pipfile.lock
            **/poetry.lock
            **/uv.lock
          sparse-checkout-cone-mode: false
      - name: Runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions
            src/lib
            src/runtime.mjs
      - name: Install runtime
        run: |
          mkdir -p .github/actions
          mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
          cp -R "$RUNNER_TEMP/code-foundry/.github/actions/." .github/actions/
      - name: Detect
        id: profile
        env:
          REPO_FOUNDRY_PRIVATE: ${{ github.event.repository.private }}
          REPO_FOUNDRY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: node $RUNNER_TEMP/code-foundry/src/runtime.mjs security profile >> "$GITHUB_OUTPUT"

  dependency-audit-javascript:
    name: Dependency Audit (JavaScript)
    needs: profile
    if: ${{ vars.CI_BILLING_PAUSED != 'true' && needs.profile.result == 'success' && needs.profile.outputs.javascript == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github
            .mise.toml
            mise.lock
            .npmrc
            .pnpmfile.cjs
            .yarnrc*
            **/package.json
            **/bun.lock
            **/bun.lockb
            **/pnpm-lock.yaml
            **/yarn.lock
            **/package-lock.json
          sparse-checkout-cone-mode: false
      - name: Runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions
            src/lib
            src/runtime.mjs
      - name: Install runtime
        run: |
          mkdir -p .github/actions
          mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
          cp -R "$RUNNER_TEMP/code-foundry/.github/actions/." .github/actions/
      - name: Detect
        id: applicability
        run: node $RUNNER_TEMP/code-foundry/src/runtime.mjs security should_run javascript >> "$GITHUB_OUTPUT"
      - name: Setup
        if: steps.applicability.outputs.applicable == 'true'
        uses: ./.github/actions/setup
        with:
          mise-scope: javascript
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Audit dependencies
        if: steps.applicability.outputs.applicable == 'true'
        run: node $RUNNER_TEMP/code-foundry/src/runtime.mjs security audit javascript

  dependency-audit-rust:
    name: Dependency Audit (Rust)
    needs: profile
    if: ${{ vars.CI_BILLING_PAUSED != 'true' && needs.profile.result == 'success' && needs.profile.outputs.rust == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github
            .mise.toml
            mise.lock
            **/Cargo.toml
            **/Cargo.lock
            **/.cargo/**
          sparse-checkout-cone-mode: false
      - name: Runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions
            src/lib
            src/runtime.mjs
      - name: Install runtime
        run: |
          mkdir -p .github/actions
          mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
          cp -R "$RUNNER_TEMP/code-foundry/.github/actions/." .github/actions/
      - name: Detect
        id: applicability
        run: node $RUNNER_TEMP/code-foundry/src/runtime.mjs security should_run rust >> "$GITHUB_OUTPUT"
      - name: Check Rust
        id: system-rust
        if: steps.applicability.outputs.applicable == 'true'
        shell: bash
        run: |
          if command -v cargo >/dev/null 2>&1 && command -v rustc >/dev/null 2>&1; then
            cargo --version
            rustc --version
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Setup
        if: >-
          steps.applicability.outputs.applicable == 'true' &&
          steps.system-rust.outputs.available != 'true'
        uses: ./.github/actions/setup
        with:
          mise-scope: rust
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Install cargo-audit
        if: steps.applicability.outputs.applicable == 'true'
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        if: steps.applicability.outputs.applicable == 'true'
        run: node $RUNNER_TEMP/code-foundry/src/runtime.mjs security audit rust

  dependency-audit-python:
    name: Dependency Audit (Python) / ${{ matrix.requirement }}
    needs: profile
    if: >-
      ${{ vars.CI_BILLING_PAUSED != 'true' &&
      needs.profile.result == 'success' &&
      needs.profile.outputs.python == 'true' &&
      needs.profile.outputs.python_requirements != '["none"]' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        requirement: ${{ fromJSON(needs.profile.outputs.python_requirements) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    env:
      REPO_FOUNDRY_PYTHON_REQUIREMENT: ${{ matrix.requirement }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github
            .mise.toml
            mise.lock
            **/pyproject.toml
            **/requirements*.txt
            **/setup.py
            **/setup.cfg
            **/Pipfile
            **/Pipfile.lock
            **/poetry.lock
            **/uv.lock
          sparse-checkout-cone-mode: false
      - name: Runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions
            src/lib
            src/runtime.mjs
      - name: Install runtime
        run: |
          mkdir -p .github/actions
          mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
          cp -R "$RUNNER_TEMP/code-foundry/.github/actions/." .github/actions/
      - name: Setup
        uses: ./.github/actions/setup
        with:
          mise-scope: python
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Audit dependencies
        run: node $RUNNER_TEMP/code-foundry/src/runtime.mjs security audit python

  dependency-audit-python-gate:
    name: Dependency Audit (Python)
    needs: [profile, dependency-audit-python]
    if: >-
      ${{ vars.CI_BILLING_PAUSED != 'true' &&
      always() &&
      needs.profile.result == 'success' &&
      needs.profile.outputs.python == 'true' &&
      needs.profile.outputs.python_requirements != '["none"]' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Gate
        env:
          PROFILE_RESULT: ${{ needs.profile.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit-python.result }}
        run: |
          if [ "$PROFILE_RESULT" != success ]; then
            echo "Python audit profile failed: $PROFILE_RESULT" >&2
            exit 1
          fi
          case "$AUDIT_RESULT" in
            success|skipped) exit 0 ;;
            *) echo "Python dependency audit failed: $AUDIT_RESULT" >&2; exit 1 ;;
          esac

  dependency-review:
    name: Dependency Review
    needs: profile
    if: ${{ vars.CI_BILLING_PAUSED != 'true' && github.event_name == 'pull_request' && needs.profile.outputs.dependency_review == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          license-check: true
