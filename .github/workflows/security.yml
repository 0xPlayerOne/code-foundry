name: Security

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-slim
    outputs:
      audit: ${{ steps.manifests.outputs.audit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect manifests
        id: manifests
        shell: bash
        run: |
          if [ -f package.json ] || [ -f Cargo.toml ] || [ -f requirements.txt ] ||
            [ -f requirements-dev.txt ] || [ -f pyproject.toml ]; then
            echo 'audit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'audit=false' >> "$GITHUB_OUTPUT"
          fi

  dependency-audit:
    name: Dependency Audit
    needs: detect
    if: needs.detect.outputs.audit == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Audit dependencies
        run: bash .github/scripts/security.sh

  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-slim
    steps:
      - name: Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          license-check: true
