name: Code Foundry Release

on:
  workflow_call:
    inputs:
      runner:
        description: Runner used by release jobs.
        required: false
        type: string
        default: ubuntu-slim
      runtime-repository:
        description: Repository containing the Code Foundry runtime.
        required: false
        type: string
        default: 0xPlayerOne/code-foundry
      runtime-ref:
        description: Code Foundry runtime tag or ref.
        required: false
        type: string
        default: v0.31.12
    secrets:
      CODE_FOUNDRY_TOKEN:
        required: false
      RELEASE_PLEASE_TOKEN:
        required: false
      STAGING_DEPLOY_KEY:
        required: false
      NPM_TOKEN:
        required: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

env:
  REPO_FOUNDRY_PROFILE: ${{ vars.REPO_FOUNDRY_PROFILE }}
  REPO_FOUNDRY_LANGUAGES: ${{ vars.REPO_FOUNDRY_LANGUAGES }}
  REPO_FOUNDRY_FEATURES: ${{ vars.REPO_FOUNDRY_FEATURES }}
  REPO_FOUNDRY_PACKAGE_MANAGER: ${{ vars.REPO_FOUNDRY_PACKAGE_MANAGER }}
  REPO_FOUNDRY_RELEASE_TYPE: ${{ vars.REPO_FOUNDRY_RELEASE_TYPE }}
  REPO_FOUNDRY_NPM_PUBLISH: ${{ vars.REPO_FOUNDRY_NPM_PUBLISH }}

jobs:
  release:
    name: Version
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    concurrency:
      group: code-foundry-release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created || 'false' }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      npm_publish: ${{ steps.profile.outputs.npm_publish }}
      token_source: ${{ steps.credentials.outputs.token_source }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          filter: blob:none
      - name: Checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: src
      - name: Prepare runtime
        run: mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
      - name: Detect release profile
        id: profile
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const config = fs.existsSync('.github/code-foundry.yml')
            ? Object.fromEntries(fs.readFileSync('.github/code-foundry.yml', 'utf8').split(/\r?\n/).flatMap((line) => {
                const match = line.match(/^([A-Za-z0-9_-]+):\s*(.*?)\s*$/)
                return match ? [[match[1], match[2].replace(/\s+#.*$/, '').replace(/^['"]|['"]$/g, '')]] : []
              }))
            : {}
          let releaseType = config.release_type || 'auto'
          let npmPublish = config.npm_publish || 'false'
          // The merge audit topology requires squash for Release Please version
          // pull requests into main. Release automation never defaults to a
          // merge method: an unset or non-squash release_merge_strategy fails
          // the release job before any pull request is created or merged.
          const releaseMergeStrategy = String(config.release_merge_strategy || '').trim().toLowerCase()
          if (releaseType === 'auto') {
            releaseType = fs.existsSync('package.json') ? 'node' : fs.existsSync('pyproject.toml') ? 'python' : fs.existsSync('Cargo.toml') ? 'rust' : fs.existsSync('version.txt') ? 'simple' : 'none'
          }
          if (!['node', 'python', 'rust', 'simple', 'none'].includes(releaseType)) throw new Error(`Unsupported release_type: ${releaseType}`)
          if (releaseMergeStrategy !== 'squash') {
            throw new Error(`release_merge_strategy must be "squash" for automated release merges; got ${releaseMergeStrategy || '(unset; release automation never defaults to merge)'}`)
          }
          if (releaseType === 'none' || !fs.existsSync('package.json')) npmPublish = 'false'
          let legacyReleaseType = ''
          if (releaseType !== 'none') {
            const sourcePath = 'release-please-config.json'
            if (!fs.existsSync(sourcePath)) throw new Error(`Missing ${sourcePath}`)
            const releaseConfig = JSON.parse(fs.readFileSync(sourcePath, 'utf8'))
            if (!releaseConfig.packages && !releaseConfig['release-type']) {
              legacyReleaseType = releaseType
            } else if (!fs.existsSync('.release-please-manifest.json')) {
              throw new Error('Missing .release-please-manifest.json: run code-foundry sync to bootstrap the release manifest.')
            }
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `release_type=${releaseType}\nlegacy_release_type=${legacyReleaseType}\nnpm_publish=${npmPublish}\nrelease_merge_strategy=${releaseMergeStrategy}\n`,
          )
          NODE
      - name: Detect release credentials
        id: credentials
        env:
          HAS_AUTOMATION_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN != '' || secrets.RELEASE_PLEASE_TOKEN != '' }}
          GH_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN || secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          # NiftyLeague rejects long-lived fine-grained automation tokens with
          # HTTP 403 even on REST (observed in the release-pr promotion flow),
          # so the configured automation token is validated against the current
          # repository before any write. gh api authenticates through the
          # GH_TOKEN environment variable and never prints the token; the
          # response body is discarded and only the exit status selects the
          # credential for the rest of the job.
          if [ "$HAS_AUTOMATION_TOKEN" = true ] && gh api "repos/${GITHUB_REPOSITORY}" --jq '.full_name' >/dev/null 2>&1; then
            echo "auto_merge=true" >> "$GITHUB_OUTPUT"
            echo "token_source=configured" >> "$GITHUB_OUTPUT"
          else
            echo "auto_merge=false" >> "$GITHUB_OUTPUT"
            echo "token_source=fallback" >> "$GITHUB_OUTPUT"
            if [ "$HAS_AUTOMATION_TOKEN" = true ]; then
              echo "::warning title=Release token fallback::The configured CODE_FOUNDRY_TOKEN or RELEASE_PLEASE_TOKEN was rejected by GitHub; failing over to the short-lived workflow token. The version pull request will be left for manual merge."
            fi
          fi
      - name: Release Please (automation token)
        id: release_automation
        if: steps.profile.outputs.release_type != 'none' && steps.credentials.outputs.token_source == 'configured'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.CODE_FOUNDRY_TOKEN || secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          release-type: ${{ steps.profile.outputs.legacy_release_type }}
      - name: Release Please (workflow token)
        id: release_workflow
        if: steps.profile.outputs.release_type != 'none' && steps.credentials.outputs.token_source != 'configured'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          release-type: ${{ steps.profile.outputs.legacy_release_type }}
      - name: Normalize Release Please outputs
        id: release
        if: steps.profile.outputs.release_type != 'none'
        env:
          AUTOMATION_RELEASE_CREATED: ${{ steps.release_automation.outputs.release_created }}
          AUTOMATION_TAG_NAME: ${{ steps.release_automation.outputs.tag_name }}
          AUTOMATION_PRS_CREATED: ${{ steps.release_automation.outputs.prs_created }}
          WORKFLOW_RELEASE_CREATED: ${{ steps.release_workflow.outputs.release_created }}
          WORKFLOW_TAG_NAME: ${{ steps.release_workflow.outputs.tag_name }}
          WORKFLOW_PRS_CREATED: ${{ steps.release_workflow.outputs.prs_created }}
        run: |
          set -euo pipefail
          # Exactly one of the two Release Please steps runs, so selecting the
          # source by a non-empty release_created is deterministic. The stable
          # release step id keeps the job outputs and downstream jobs reading
          # steps.release.outputs.* unchanged.
          if [ -n "$AUTOMATION_RELEASE_CREATED" ]; then
            {
              echo "release_created=$AUTOMATION_RELEASE_CREATED"
              echo "tag_name=$AUTOMATION_TAG_NAME"
              echo "prs_created=$AUTOMATION_PRS_CREATED"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "release_created=$WORKFLOW_RELEASE_CREATED"
              echo "tag_name=$WORKFLOW_TAG_NAME"
              echo "prs_created=$WORKFLOW_PRS_CREATED"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Normalize generated release PR draft state
        if: steps.release.outcome == 'success'
        env:
          # The credential selected by the validation step is reused verbatim
          # for every release-PR shell operation: the configured token only
          # when it validated, github.token after fallback. The token value
          # lives only in this masked env expression, never in step outputs.
          AUTO_MERGE: ${{ steps.credentials.outputs.auto_merge }}
          GH_TOKEN: ${{ steps.credentials.outputs.token_source == 'configured' && (secrets.CODE_FOUNDRY_TOKEN || secrets.RELEASE_PLEASE_TOKEN) || github.token }}
        run: |
          set -euo pipefail
          mapfile -t release_prs < <(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base main \
              --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("release-please--branches--main")) | .number'
          )

          if [ ${#release_prs[@]} -eq 0 ]; then
            exit 0
          fi

          for pr in "${release_prs[@]}"; do
            PR_DRAFT=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [ "$AUTO_MERGE" = true ]; then
              if [ "$PR_DRAFT" = true ]; then
                gh pr ready "$pr" --repo "$GITHUB_REPOSITORY"
              fi
            else
              if [ "$PR_DRAFT" = false ]; then
                gh pr ready --undo "$pr" --repo "$GITHUB_REPOSITORY"
              fi
              echo "::notice title=Manual release merge required::Release Please created or updated a version pull request. No valid automation token is available (absent or rejected by GitHub), so release PRs are left in draft and need manual readiness before validation and merge workflows trigger."
            fi
          done
      - name: Leave release pull request for manual merge
        if: steps.release.outputs.prs_created == 'true' && steps.credentials.outputs.auto_merge != 'true'
        run: |
          echo "::notice title=Manual release merge required::Release Please created or updated a version pull request. Configure a valid CODE_FOUNDRY_TOKEN or RELEASE_PLEASE_TOKEN to enable guarded auto-merge when downstream release workflows require it."

      - name: Merge generated version pull requests
        if: steps.credentials.outputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ steps.credentials.outputs.token_source == 'configured' && (secrets.CODE_FOUNDRY_TOKEN || secrets.RELEASE_PLEASE_TOKEN) || github.token }}
        run: |
          set -euo pipefail
          mapfile -t release_prs < <(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base main \
              --json number,title,headRefName \
              --jq '.[] | select(.title | startswith("chore(main): release ")) | select(.headRefName | startswith("release-please--branches--main")) | .number'
          )
          if [ "${#release_prs[@]}" -eq 0 ]; then
            echo 'No generated release pull request is open; nothing to merge.'
            exit 0
          fi
          node "$RUNNER_TEMP/code-foundry/src/cli.mjs" release validate-prs
          for pr in "${release_prs[@]}"; do
            echo "Waiting for required checks on release PR #$pr"
            checks_seen=false
            for attempt in $(seq 1 60); do
              : "$attempt"
              if required_count=$(gh pr checks "$pr" \
                --repo "$GITHUB_REPOSITORY" \
                --required \
                --json name \
                --jq 'length' 2>/dev/null); then
                if [ "$required_count" -gt 0 ]; then
                  checks_seen=true
                  break
                fi
              fi
              sleep 5
            done
            if [ "$checks_seen" != true ]; then
              echo "Required checks were not registered for release PR #$pr within the readiness window." >&2
              exit 1
            fi
            gh pr checks "$pr" \
              --repo "$GITHUB_REPOSITORY" \
              --required \
              --watch \
              --fail-fast \
              --interval 10
            # gh pr checks --watch only waits for checks registered when the
            # watch starts; a ruleset may register additional required checks
            # afterwards (observed: "Validation / Gate" appearing after
            # "Tauri 2 / Linux" had passed), which leaves the PR blocked by
            # branch policy at merge time. Poll mergeStateStatus and accept
            # only states GitHub reports as mergeable: CLEAN, or UNSTABLE with
            # mergeable MERGEABLE. UNSTABLE is still mergeable when only
            # non-required checks are failing or still running (observed: Kilo
            # Code Review running after every required check passed); keep
            # waiting for BLOCKED/BEHIND/UNKNOWN, fail fast on
            # DIRTY/CONFLICTING, and fail closed on a bounded timeout so the
            # workflow never sleeps indefinitely.
            echo "Waiting for release PR #$pr to become mergeable under branch policy"
            merge_state=UNKNOWN
            mergeable=UNKNOWN
            for attempt in $(seq 1 30); do
              : "$attempt"
              if read -r merge_state mergeable < <(
                gh pr view "$pr" \
                  --repo "$GITHUB_REPOSITORY" \
                  --json mergeStateStatus,mergeable \
                  --jq '[.mergeStateStatus, .mergeable] | @tsv' 2>/dev/null
              ); then
                case "$merge_state" in
                  CLEAN|UNSTABLE)
                    if [ "$mergeable" = MERGEABLE ]; then
                      break
                    fi
                    ;;
                  DIRTY)
                    echo "Release PR #$pr is not mergeable (mergeStateStatus=$merge_state); resolve conflicts before retrying the release." >&2
                    exit 1
                    ;;
                esac
                if [ "$mergeable" = CONFLICTING ]; then
                  echo "Release PR #$pr is not mergeable (mergeable=$mergeable); resolve conflicts before retrying the release." >&2
                  exit 1
                fi
              else
                # gh API failure: read leaves the variables empty on EOF;
                # treat the state as unknown and keep polling.
                merge_state=UNKNOWN
                mergeable=UNKNOWN
              fi
              sleep 10
            done
            if { [ "$merge_state" != CLEAN ] && [ "$merge_state" != UNSTABLE ]; } || [ "$mergeable" != MERGEABLE ]; then
              echo "Release PR #$pr did not become mergeable within the mergeability window (last mergeStateStatus=$merge_state, mergeable=$mergeable). Required checks may still be pending or branch policy blocks the merge; review the pull request before retrying." >&2
              exit 1
            fi
            release_head=$(gh pr view "$pr" \
              --repo "$GITHUB_REPOSITORY" \
              --json headRefOid \
              --jq '.headRefOid')
            if [ -z "$release_head" ]; then
              echo "Could not resolve head commit SHA for release PR #$pr" >&2
              exit 1
            fi
            gh pr merge "$pr" \
              --repo "$GITHUB_REPOSITORY" \
              --${{ steps.profile.outputs.release_merge_strategy }} \
              --match-head-commit "$release_head" \
              --delete-branch
          done

  reconcile:
    name: Reconcile
    needs: release
    # A normal promotion push can successfully run Release Please without
    # creating a release. Reconciliation is only meaningful after a release
    # commit/tag is actually created; otherwise the promotion's source changes
    # are incorrectly rejected as non-metadata commits.
    if: needs.release.result == 'success' && needs.release.outputs.release_created == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      # Reconciliation is the sole staging-ruleset bypass. Keep GH_TOKEN scoped to
      # the repository's own GitHub Actions integration token; deploy key use is
      # optional and only activated when STAGING_DEPLOY_KEY is provided.
      GH_TOKEN: ${{ github.token }}
      STAGING_DEPLOY_KEY_PRESENT: ${{ secrets.STAGING_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            src
            release-please-config.json
      - name: Prepare runtime
        run: mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
      - name: Check staging branch
        id: staging
        run: |
          if git ls-remote --exit-code origin refs/heads/staging >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            git fetch --no-tags origin main staging
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure staging reconcile transport
        id: staging-reconcile-ssh
        if: steps.staging.outputs.exists == 'true' && env.STAGING_DEPLOY_KEY_PRESENT == 'true'
        env:
          STAGING_DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          STAGING_SSH_DIR: ${{ runner.temp }}/staging-reconcile-ssh
        run: |
          set -euo pipefail
          mkdir -p "$STAGING_SSH_DIR"
          chmod 700 "$STAGING_SSH_DIR"
          STAGING_KEY="$STAGING_SSH_DIR/staging_deploy_key"
          STAGING_HOSTS="$STAGING_SSH_DIR/known_hosts"
          printf '%s\n' "$STAGING_DEPLOY_KEY" > "$STAGING_KEY"
          chmod 600 "$STAGING_KEY"
          node <<'NODE' > "$STAGING_HOSTS"
          const { execSync } = require('node:child_process')
          const meta = JSON.parse(execSync('gh api /meta', { encoding: 'utf8' }))
          const keys = Array.isArray(meta?.ssh_keys) ? meta.ssh_keys : []
          const lines = keys
            .filter((value) => typeof value === 'string' && value.trim())
            .map((value) => `github.com ${value.trim()}`)
            .join('\n')
          if (!lines) process.exit(1)
          process.stdout.write(`${lines}\n`)
          NODE
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"
          echo "ssh_command=ssh -F /dev/null -i $STAGING_KEY -o IdentitiesOnly=yes -o UserKnownHostsFile=$STAGING_HOSTS -o StrictHostKeyChecking=yes" >> "$GITHUB_OUTPUT"
      - name: Configure git for trusted reconcile
        if: steps.staging.outputs.exists == 'true' && env.STAGING_DEPLOY_KEY_PRESENT != 'true'
        run: gh auth setup-git
      - name: Reconcile release metadata
        if: steps.staging.outputs.exists == 'true'
        env:
          GIT_SSH_COMMAND: ${{ steps.staging-reconcile-ssh.outputs.ssh_command || '' }}
        run: node "$RUNNER_TEMP/code-foundry/src/cli.mjs" release reconcile --github --base main --head staging
      - name: Clear reconcile SSH material
        if: always() && steps.staging.outputs.exists == 'true'
        env:
          STAGING_SSH_DIR: ${{ runner.temp }}/staging-reconcile-ssh
        run: |
          rm -f -- "$STAGING_SSH_DIR/staging_deploy_key" "$STAGING_SSH_DIR/known_hosts"
          rmdir "$STAGING_SSH_DIR" 2>/dev/null || true
      - name: Skip without staging
        if: steps.staging.outputs.exists != 'true'
        run: echo 'No staging branch exists; release reconciliation is not applicable.'

  post-release:
    name: Post Hook
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    concurrency:
      group: code-foundry-post-release-${{ github.repository }}-${{ needs.release.outputs.tag_name }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    env:
      # The release job validates the configured automation token and exposes
      # the selection; the post hook reuses the same selected credential so a
      # rejected long-lived token is never used after fallback.
      RELEASE_PLEASE_TOKEN: ${{ needs.release.outputs.token_source == 'configured' && (secrets.CODE_FOUNDRY_TOKEN || secrets.RELEASE_PLEASE_TOKEN) || github.token }}
      GH_TOKEN: ${{ needs.release.outputs.token_source == 'configured' && (secrets.CODE_FOUNDRY_TOKEN || secrets.RELEASE_PLEASE_TOKEN) || github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag_name }}
          filter: blob:none
      - name: Checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: src
      - name: Prepare runtime
        run: mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
      - name: Detect post-release hook
        id: hook
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs')
          const file = '.github/code-foundry.yml'
          const config = fs.existsSync(file)
            ? Object.fromEntries(fs.readFileSync(file, 'utf8').split(/\r?\n/).flatMap((line) => {
                const match = line.match(/^([A-Za-z0-9_-]+):\s*(.*?)\s*$/)
                return match ? [[match[1], match[2].replace(/\s+#.*$/, '').replace(/^['"]|['"]$/g, '')]] : []
              }))
            : {}
          const enabled = ['true', 'auto'].includes(config.post_release ?? 'false')
          console.log(`enabled=${enabled}`)
          console.log(`workflow=${config.post_release_workflow ?? ''}`)
          console.log(`mode=${config.post_release_mode ?? 'auto'}`)
          NODE
      - name: Dispatch post-release hook once
        if: steps.hook.outputs.enabled == 'true' && steps.hook.outputs.workflow != ''
        run: node "$RUNNER_TEMP/code-foundry/src/cli.mjs" release hook --tag '${{ needs.release.outputs.tag_name }}' --workflow '${{ steps.hook.outputs.workflow }}' --mode '${{ steps.hook.outputs.mode }}'
      - name: Explain disabled post-release hook
        if: steps.hook.outputs.enabled != 'true' || steps.hook.outputs.workflow == ''
        run: echo 'No post-release workflow configured; artifact delivery is intentionally skipped.'

  npm:
    name: Publish npm
    needs: release
    if: needs.release.outputs.release_created == 'true' && needs.release.outputs.npm_publish == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag_name }}
      - name: Setup Node (trusted)
        if: env.NPM_TOKEN == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Setup Node (token)
        if: env.NPM_TOKEN != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish npm with token
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: Publish npm with trusted publishing
        if: env.NPM_TOKEN == ''
        run: npm publish --provenance --access public
