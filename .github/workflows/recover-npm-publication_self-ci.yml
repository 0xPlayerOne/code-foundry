name: Recover Qualified npm Publication

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Exact current-version immutable GitHub release whose npm publication failed.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: code-foundry-npm-recovery-${{ github.repository }}-${{ inputs['release-tag'] }}
  cancel-in-progress: false

jobs:
  target:
    name: Verify recovery target
    if: github.ref == 'refs/heads/main' && vars.CI_BILLING_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      asset: ${{ steps.target.outputs.asset }}
      source-sha: ${{ steps.target.outputs.source-sha }}
    steps:
      - name: Checkout trusted release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Require exact immutable release and absent npm version
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs['release-tag'] }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { spawnSync } from 'node:child_process'
          import { resolveTagCommit, runGh } from './src/commands/release-integrity.mjs'
          import { requireNpmVersionMissing, validateRecoveryTarget } from './src/commands/release-recovery.mjs'

          const repository = process.env.GITHUB_REPOSITORY
          const tag = process.env.RELEASE_TAG
          const currentSha = process.env.CURRENT_SHA
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version
          const sourceSha = resolveTagCommit(repository, tag)
          const releaseResult = runGh([
            'api',
            '--hostname',
            'github.com',
            `repos/${repository}/releases/tags/${encodeURIComponent(tag)}`,
          ])
          if (releaseResult.status !== 0) throw new Error('Could not verify the requested GitHub release')
          let release
          try {
            release = JSON.parse(releaseResult.stdout)
          } catch {
            throw new Error('GitHub returned invalid release metadata')
          }
          const ancestor = spawnSync('git', ['merge-base', '--is-ancestor', sourceSha, currentSha])
          const target = validateRecoveryTarget({
            tag,
            version,
            release,
            sourceSha,
            currentSha,
            sourceIsAncestor: ancestor.status === 0,
          })
          const npm = spawnSync(
            'npm',
            ['view', `code-foundry@${version}`, 'version', '--json', '--registry', 'https://registry.npmjs.org'],
            { encoding: 'utf8', timeout: 30_000, maxBuffer: 1024 * 1024 }
          )
          requireNpmVersionMissing({ status: npm.status, stderr: npm.stderr ?? '', version })
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `tag=${target.tag}\nasset=${target.asset}\nsource-sha=${target.sourceSha}\n`
          )
          console.log(`Recovery target verified: ${target.tag} at ${target.sourceSha}`)
          NODE

  publish:
    name: Requalify and publish exact archive
    needs: target
    if: github.ref == 'refs/heads/main' && needs.target.result == 'success' && vars.CI_BILLING_PAUSED != 'true'
    uses: ./.github/workflows/qualified-foundry-publish.yml
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    with:
      tag: ${{ needs.target.outputs.tag }}
      asset: ${{ needs.target.outputs.asset }}
      source-sha: ${{ needs.target.outputs['source-sha'] }}
      billing-pause-bypass: false
