name: Code Foundry Draft Guard

on:
  # This workflow runs from the trusted base branch and only reads pull-request
  # metadata before changing draft state. It never checks out or executes PR code.
  pull_request_target:
    branches: [main, staging]
    types:
      - opened
      - reopened

# GitHub only lets a GitHub App token change a pull request's draft state
# (convertPullRequestToDraft / markPullRequestReadyForReview) when the token can
# also push to the repository; with pull-requests: write alone the mutation is
# refused with "Resource not accessible by integration". contents: write is that
# push grant. The job never checks out or runs pull-request code and pushes nothing.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: code-foundry-draft-guard-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enforce:
    name: Draft Guard / Enforce
    if: vars.CI_BILLING_PAUSED != 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Keep ordinary pull requests in draft
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$EVENT_HEAD_SHA" ] || [ -z "$EVENT_UPDATED_AT" ] || [ -z "$PR_NUMBER" ]; then
            echo '::error title=Draft guard cannot verify event freshness::The pull-request event did not include the required immutable metadata.'
            exit 1
          fi
          if [ "$EVENT_DRAFT" != true ] && [ "$EVENT_DRAFT" != false ]; then
            echo "::error title=Draft guard cannot verify event state::Unexpected event draft value: $EVENT_DRAFT"
            exit 1
          fi

          # A pull request opened or reopened as a draft already satisfies the
          # guard. Any non-draft state seen now came from a later, deliberate
          # ready_for_review, which can land within the same second as the
          # event and so slip past the updated_at freshness check below.
          if [ "$EVENT_DRAFT" = true ]; then
            echo "Pull request #$PR_NUMBER was a draft when this event fired; a later ready state is a deliberate ready_for_review, leaving it unchanged."
            exit 0
          fi

          read -r draft head_ref head_sha updated_at node_id < <(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '[.draft, .head.ref, .head.sha, .updated_at, .node_id] | @tsv'
          )
          if [ -z "$draft" ] || [ -z "$head_ref" ] || [ -z "$head_sha" ] || [ -z "$updated_at" ] || [ -z "$node_id" ]; then
            echo '::error title=Draft guard cannot verify current state::The GitHub API response did not include the required pull-request metadata.'
            exit 1
          fi

          # Release Please owns the state of generated version PRs. Its release
          # workflow deliberately resets and readies these PRs before merging.
          case "$head_ref" in
            release-please--branches--main|release-please--branches--main--*)
              echo "Release Please head $head_ref is managed by the release workflow; leaving its draft state unchanged."
              exit 0
              ;;
          esac

          # A newer state transition superseded this event. Do not undo a
          # user's later explicit readiness decision with a stale event.
          if [ "$head_sha" != "$EVENT_HEAD_SHA" ] || [ "$updated_at" != "$EVENT_UPDATED_AT" ]; then
            echo 'A newer pull-request state or head commit superseded this draft-guard event; leaving the current state unchanged.'
            exit 0
          fi

          if [ "$draft" = true ]; then
            echo "Pull request #$PR_NUMBER is already a draft; no validation state change is needed."
            exit 0
          fi
          if [ "$draft" != false ]; then
            echo "::error title=Draft guard cannot verify current state::Unexpected draft value: $draft"
            exit 1
          fi

          # updated_at has one-second granularity, so a ready_for_review in the
          # same second as this event is invisible to the freshness check. Any
          # ready_for_review at or after the event supersedes it.
          ready_events=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/timeline?per_page=100" \
            --jq '.[] | select(.event == "ready_for_review") | .created_at')
          while IFS= read -r ready_at; do
            [ -n "$ready_at" ] || continue
            if [[ "$ready_at" > "$EVENT_UPDATED_AT" || "$ready_at" == "$EVENT_UPDATED_AT" ]]; then
              echo "Pull request #$PR_NUMBER was marked ready for review at $ready_at, superseding this $EVENT_UPDATED_AT event; leaving it unchanged."
              exit 0
            fi
          done <<< "$ready_events"

          result=$(gh api graphql \
            -f query='mutation($pullRequestId: ID!) { convertPullRequestToDraft(input: {pullRequestId: $pullRequestId}) { pullRequest { id isDraft } } }' \
            -f pullRequestId="$node_id" \
            --jq '.data.convertPullRequestToDraft.pullRequest | [.id, .isDraft] | @tsv')
          read -r returned_id is_draft <<< "$result"
          if [ "$returned_id" != "$node_id" ] || [ "$is_draft" != true ]; then
            echo '::error title=Draft guard conversion failed::GraphQL did not confirm the expected pull request is a draft.'
            exit 1
          fi
          echo "Converted ordinary pull request #$PR_NUMBER to draft; validation waits for ready_for_review."
