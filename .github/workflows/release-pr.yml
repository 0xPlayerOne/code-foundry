name: Code Foundry Release PR

on:
  workflow_call:
    inputs:
      runner:
        description: Runner used to create the release PR.
        required: false
        type: string
        default: ubuntu-slim
    secrets:
      CODE_FOUNDRY_TOKEN:
        required: false
      RELEASE_PLEASE_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write

env:
  HAS_AUTOMATION_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN != '' || secrets.RELEASE_PLEASE_TOKEN != '' }}

jobs:
  create-release-pr:
    name: Create
    if: vars.CI_BILLING_PAUSED != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    concurrency:
      group: code-foundry-release-pr-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Configure git auth for blob fetch
        # The partial clone (filter: blob:none) defers blob downloads, so the
        # merge-base/diff comparison below can trigger a promisor fetch. With
        # persist-credentials disabled, git has no auth for that fetch; configure
        # the credential helper with the short-lived workflow token. NiftyLeague
        # rejects long-lived fine-grained automation tokens with HTTP 403 even
        # on REST, so all read-only operations use github.token; it is scoped
        # to contents: read, so this never enables write credentials.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Check
        id: check-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every lookup in this step is read-only and uses the short-lived
          # workflow token: NiftyLeague rejects long-lived fine-grained
          # automation tokens with HTTP 403 even on REST. The
          # existing-promotion-PR lookup uses authenticated REST (gh api)
          # rather than gh pr list, which issues a GraphQL query that
          # NiftyLeague's long-lived fine-grained token policy rejects. The
          # REST query keeps the exact base/head/state filter and the per_page=1
          # cap (existing is 0 or 1) and fails closed on any API error.
          EXISTING=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?base=main&head=staging&state=open&per_page=1" \
            --jq 'length')
          MAIN_TREE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.commit.tree.sha')
          STAGING_TREE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/staging" --jq '.commit.tree.sha')
          TREE_EQUAL=false
          if [ "$MAIN_TREE" = "$STAGING_TREE" ]; then
            TREE_EQUAL=true
          fi
          COMPARE_URL="repos/${GITHUB_REPOSITORY}/compare/main...staging"
          TOTAL_COMMITS=$(gh api "$COMPARE_URL?per_page=1" --jq '.total_commits // 0')

          MAIN_IS_ANCESTOR=false
          if git merge-base --is-ancestor origin/main origin/staging; then
            MAIN_IS_ANCESTOR=true
          fi
          DIRECT_FILES="$RUNNER_TEMP/release-direct-files.txt"
          git diff --name-only origin/staging origin/main > "$DIRECT_FILES"
          RELEASE_ONLY=false
          if [ "$MAIN_IS_ANCESTOR" != true ] && [ -s "$DIRECT_FILES" ]; then
            if node - "$DIRECT_FILES" <<'NODE'
          const { existsSync, readFileSync } = require('node:fs')
          const directFiles = readFileSync(process.argv[2], 'utf8').split(/\r?\n/).filter(Boolean)
          const defaults = [
            '.release-please-manifest.json', 'CHANGELOG.md', 'Cargo.lock', 'Cargo.toml',
            'bun.lock', 'bun.lockb', 'package-lock.json', 'package.json', 'pnpm-lock.yaml',
            'pyproject.toml', 'uv.lock', 'version.txt', 'yarn.lock',
          ]
          const allowed = new Set(defaults)
          let config = {}
          if (existsSync('release-please-config.json')) {
            try { config = JSON.parse(readFileSync('release-please-config.json', 'utf8')) } catch {}
          }
          const addPath = (prefix, file) => {
            const clean = file.replace(/^\.\//, '').replace(/\\/g, '/')
            allowed.add(prefix ? `${prefix}/${clean}` : clean)
          }
          const addExtras = (entries, prefix = '') => {
            if (!Array.isArray(entries)) return
            for (const entry of entries) {
              const file = typeof entry === 'string' ? entry : entry && typeof entry === 'object' ? entry.path : ''
              if (typeof file === 'string' && file) addPath(prefix, file)
            }
          }
          addExtras(config['extra-files'])
          if (config.packages && typeof config.packages === 'object' && !Array.isArray(config.packages)) {
            for (const [directory, value] of Object.entries(config.packages)) {
              const prefix = directory === '.' ? '' : directory.replace(/\/$/, '')
              for (const file of defaults) addPath(prefix, file)
              if (value && typeof value === 'object' && !Array.isArray(value)) addExtras(value['extra-files'], prefix)
            }
          }
          const unexpected = directFiles.filter((file) => !allowed.has(file))
          if (unexpected.length) {
            console.error(`Direct branch diff includes non-release paths: ${unexpected.join(', ')}`)
            process.exit(1)
          }
          NODE
            then
              RELEASE_ONLY=true
            fi
          fi
          {
            echo "existing=$EXISTING"
            echo "commits=$TOTAL_COMMITS"
            echo "tree_equal=$TREE_EQUAL"
            echo "release_only=$RELEASE_ONLY"
          } >> "$GITHUB_OUTPUT"

      - name: No changes
        if: steps.check-pr.outputs.existing == '0' && (steps.check-pr.outputs.commits == '0' || steps.check-pr.outputs.tree_equal == 'true' || steps.check-pr.outputs.release_only == 'true')
        env:
          RELEASE_ONLY: ${{ steps.check-pr.outputs.release_only }}
        run: |
          if [ "$RELEASE_ONLY" = true ]; then
            echo 'Only approved release metadata differs between rebased branch histories; reconciliation from main to staging is pending, so no promotion PR is needed.'
          else
            echo 'staging is already aligned with main; no promotion PR is needed.'
          fi

      - name: Create
        if: steps.check-pr.outputs.existing == '0' && steps.check-pr.outputs.commits != '0' && steps.check-pr.outputs.tree_equal != 'true' && steps.check-pr.outputs.release_only != 'true'
        env:
          GH_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN || secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BODY_FILE="$RUNNER_TEMP/release-pr.md"
          COMPARE_URL="repos/${GITHUB_REPOSITORY}/compare/main...staging"
          COMPARE_FILE="$RUNNER_TEMP/release-compare.json"
          gh api "$COMPARE_URL?per_page=100" > "$COMPARE_FILE"
          TOTAL_COMMITS=$(node -e 'const d=require(process.argv[1]); console.log(d.total_commits || 0)' "$COMPARE_FILE")
          if [ "$TOTAL_COMMITS" -gt 100 ]; then
            LAST_PAGE=$(( (TOTAL_COMMITS + 99) / 100 ))
            gh api "$COMPARE_URL?per_page=100&page=$LAST_PAGE" > "$COMPARE_FILE"
          fi
          COMMITS=$(node -e "const d=require(process.argv[1]); for (const c of d.commits || []) console.log('- ' + c.commit.message.split('\\n')[0] + ' (' + c.sha.slice(0, 7) + ')')" "$COMPARE_FILE")
          if [ -z "$COMMITS" ]; then
            COMMITS='- No commits found since main.'
          fi

          if [ "$TOTAL_COMMITS" -eq 1 ]; then
            CHANGE_LABEL=change
          else
            CHANGE_LABEL=changes
          fi

          cat > "$BODY_FILE" <<EOF
          ## Environment promotion

          Promote the validated \`staging\` environment into \`main\`.
          This is a deployment-promotion PR, not the version-release PR.

          - **Source:** \`staging\`
          - **Target:** \`main\`
          - **Changes:** $TOTAL_COMMITS $CHANGE_LABEL
          - **Created:** $DATE

          ### Commit summary

          $COMMITS

          ### Validation

          - Required CI, test, security, and CodeQL checks must pass before merge.
          - Merge using the repository's configured \`merge_strategy\` (**rebase**).
          - The promotion topology requires rebase; never merge a promotion PR with a merge commit.
          - After merge, Release Please opens a separate versioned release PR with the changelog.
          EOF

          # Creation uses authenticated REST (gh api POST) rather than
          # `gh pr create`, which issues a GraphQL mutation that
          # NiftyLeague's long-lived fine-grained token policy rejects. The
          # REST payload keeps the exact base/head/title/body fields, adds
          # draft=true only when no automation token is configured, and stays
          # fail-closed through the create-race fallback below.
          CREATE_ARGS=(
            "repos/${GITHUB_REPOSITORY}/pulls"
            --method POST
            --field base=main
            --field head=staging
            --field title="Promote staging -> main ($DATE)"
            --field body=@"$BODY_FILE"
          )
          if [ "$HAS_AUTOMATION_TOKEN" != true ]; then
            CREATE_ARGS+=(--field draft=true)
            echo "::notice title=Manual PR readiness required::Created draft promotion PR because no automation token is configured. Configure CODE_FOUNDRY_TOKEN or RELEASE_PLEASE_TOKEN, or mark this PR ready manually to trigger validation."
          fi

          # Prefer the configured automation token for the write, but
          # NiftyLeague rejects long-lived fine-grained tokens with HTTP 403
          # even on REST, so retry the POST once with the short-lived workflow
          # token before the create-race fallback. With no automation token
          # configured, the first attempt already runs as github.token, so the
          # retry only applies when an automation token was configured.
          CREATED=false
          if gh api "${CREATE_ARGS[@]}"; then
            CREATED=true
          elif [ "$HAS_AUTOMATION_TOKEN" = true ]; then
            echo "::warning title=Token fallback::Automation token PR creation failed; retrying with the short-lived workflow token."
            if GH_TOKEN="${{ github.token }}" gh api "${CREATE_ARGS[@]}"; then
              CREATED=true
            fi
          fi

          if [ "$CREATED" != true ]; then
            # The create-race lookup runs only after creation failed: with a
            # configured automation token that was rejected (its github.token
            # retry also failed), or with no automation token configured, when
            # the first attempt already ran as github.token. The lookup uses
            # the same authenticated REST query as the Check step, always with
            # the short-lived workflow token; gh pr list issues a GraphQL query
            # that NiftyLeague's long-lived fine-grained token policy rejects.
            EXISTING_NUMBER=$(GH_TOKEN="${{ github.token }}" gh api \
              "repos/${GITHUB_REPOSITORY}/pulls?base=main&head=staging&state=open&per_page=1" \
              --jq '.[0].number // empty')
            if [ -z "$EXISTING_NUMBER" ]; then
              echo 'Pull request creation failed and no existing promotion PR was found.' >&2
              exit 1
            fi
            echo "Promotion PR #$EXISTING_NUMBER already exists; treating the create race as success."
          fi
