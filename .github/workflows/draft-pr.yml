name: Code Foundry Draft PR

on:
  workflow_call:
    inputs:
      runner:
        description: Runner used to create the draft PR.
        required: false
        type: string
        default: ubuntu-slim

permissions:
  contents: read
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  create-draft-pr:
    name: Create
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    concurrency:
      group: code-foundry-draft-pr-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check
        id: check-pr
        run: |
          BRANCH="${{ github.ref_name }}"
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --limit 1 --base staging --head "$BRANCH" --state open --json number,title 2>/dev/null | node -e 'let d=""; process.stdin.on("data", c => d += c).on("end", () => console.log(JSON.parse(d || "[]").length))')
          echo "existing=$EXISTING" >> "$GITHUB_OUTPUT"

      - name: Create
        if: steps.check-pr.outputs.existing == '0'
        run: |
          BRANCH="${{ github.ref_name }}"
          PREFIX="${BRANCH%%/*}"
          SUFFIX="${BRANCH#*/}"
          PR_TITLE=""

          case "$PREFIX" in
            feat|fix|chore|refactor|docs|test|style|ci|build)
              if [ "$SUFFIX" != "$BRANCH" ] && [ -n "$SUFFIX" ]; then
                PR_TITLE="${PREFIX}: ${SUFFIX}"
              fi
              ;;
            *)
              ;;
          esac

          PR_TITLE="${PR_TITLE//[\/_]/ }"
          PR_TITLE="$(printf '%s' "$PR_TITLE" | tr -s ' ' | sed 's/^ *//; s/ *$//')"

          if [ -z "$PR_TITLE" ]; then
            PR_TITLE=$(git log -1 --pretty=%s 2>/dev/null || true)
          fi
          if [ -z "$PR_TITLE" ]; then
            PR_TITLE="$BRANCH"
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base staging \
            --head "$BRANCH" \
            --draft \
            --title "$PR_TITLE" \
            --body "Draft PR created automatically by CI.

            This PR is a draft and should not be merged until CI passes and a reviewer (or the Daily Review agent) marks it ready.

            **CI Status:** Pending — this workflow triggered on push to \`$BRANCH\`."

      - name: Mark ready
        if: steps.check-pr.outputs.existing == '0'
        run: |
          BRANCH="${{ github.ref_name }}"
          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --limit 1 --base staging --head "$BRANCH" --state open --json number 2>/dev/null | node -e 'let d=""; process.stdin.on("data", c => d += c).on("end", () => console.log(JSON.parse(d || "[]")[0]?.number || ""))')
          if [ -n "$PR_NUMBER" ]; then
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi
