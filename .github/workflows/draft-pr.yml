name: Code Foundry Draft PR

on:
  workflow_call:
    inputs:
      runner:
        description: Runner used to create the draft PR.
        required: false
        type: string
        default: ubuntu-slim
      base:
        description: Base branch for the draft pull request (staging for the staging-release topology, main for the direct topology).
        required: false
        type: string
        default: staging
    secrets:
      CODE_FOUNDRY_TOKEN:
        required: false
      RELEASE_PLEASE_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  create-draft-pr:
    name: Create
    if: vars.CI_BILLING_PAUSED != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    concurrency:
      group: code-foundry-draft-pr-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check
        id: check-pr
        env:
          HEAD_REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="$HEAD_REF"
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --limit 1 --base "${{ inputs.base }}" --head "$BRANCH" --state open --json number,title 2>/dev/null | node -e 'let d=""; process.stdin.on("data", c => d += c).on("end", () => console.log(JSON.parse(d || "[]").length))')
          echo "existing=$EXISTING" >> "$GITHUB_OUTPUT"

      - name: Create
        if: steps.check-pr.outputs.existing == '0'
        env:
          AUTOMATION_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN || secrets.RELEASE_PLEASE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BRANCH="$HEAD_REF"
          PREFIX="${BRANCH%%/*}"
          SUFFIX="${BRANCH#*/}"
          PR_TITLE=""

          case "$PREFIX" in
            feat|fix|chore|refactor|docs|test|style|ci|build)
              if [ "$SUFFIX" != "$BRANCH" ] && [ -n "$SUFFIX" ]; then
                PR_TITLE="${PREFIX}: ${SUFFIX}"
              fi
              ;;
            *)
              ;;
          esac

          PR_TITLE="${PR_TITLE//[\/_]/ }"
          PR_TITLE="$(printf '%s' "$PR_TITLE" | tr -s ' ' | sed 's/^ *//; s/ *$//')"

          if [ -z "$PR_TITLE" ]; then
            PR_TITLE=$(git log -1 --pretty=%s 2>/dev/null || true)
          fi
          if [ -z "$PR_TITLE" ]; then
            PR_TITLE="$BRANCH"
          fi

          BODY_FILE=$(mktemp)
          ERROR_FILE=$(mktemp)
          trap 'rm -f -- "$BODY_FILE" "$ERROR_FILE"' EXIT
          cat > "$BODY_FILE" <<EOF
          CI PR created automatically by this workflow.

          This PR is ready for review once required validation passes. If the
          configured automation token is rejected, it is intentionally opened
          as a draft for manual readiness.

          **CI Status:** Pending — this workflow triggered on push to $BRANCH.
          EOF

          CREATE_ARGS=(
            "repos/${GITHUB_REPOSITORY}/pulls"
            --method POST
            --field base="${{ inputs.base }}"
            --field head="$BRANCH"
            --field title="$PR_TITLE"
            --field body="@$BODY_FILE"
          )

          CREATED=false
          if [ -n "$AUTOMATION_TOKEN" ] && GH_TOKEN="$AUTOMATION_TOKEN" gh api "${CREATE_ARGS[@]}" > /dev/null 2> "$ERROR_FILE"; then
            CREATED=true
          fi

          if [ "$CREATED" != true ]; then
            DRAFT_ARGS=("${CREATE_ARGS[@]}" --field draft=true)
            if GH_TOKEN="$GITHUB_TOKEN" gh api "${DRAFT_ARGS[@]}" > /dev/null 2> "$ERROR_FILE"; then
              echo "::notice title=Manual PR readiness required::The configured automation token was absent or rejected; this PR was opened as a draft with the short-lived workflow token."
              CREATED=true
            fi
          fi

          if [ "$CREATED" != true ]; then
            echo "::error title=Draft PR creation failed::Both the configured automation token and the workflow token failed to create the pull request."
            exit 1
          fi
