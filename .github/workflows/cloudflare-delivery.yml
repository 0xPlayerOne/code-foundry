name: Code Foundry Cloudflare Delivery

on:
  workflow_call:
    inputs:
      runtime-ref:
        description: 'Immutable 40-character Code Foundry commit SHA containing this workflow and its helper.'
        required: true
        type: string
      worker-name:
        description: 'Exact effective Worker name, including any Wrangler environment suffix.'
        required: true
        type: string
      artifact-path:
        description: 'Build output subdirectory relative to working-directory; must cover uploaded code/assets.'
        required: true
        type: string
      verify-command:
        description: 'Required JSON argv array. Receives BASE_URL and FOUNDRY_DEPLOYMENT_PHASE.'
        required: true
        type: string
      mode:
        required: false
        type: string
        default: preview
      draft-protection:
        description: 'Skip draft pull requests by default; set false to run candidate gates for drafts.'
        required: false
        type: boolean
        default: true
      working-directory:
        required: false
        type: string
        default: '.'
      install-working-directory:
        required: false
        type: string
        default: '.'
      build-script:
        required: false
        type: string
        default: build
      bun-version:
        required: false
        type: string
        default: '1.4.0'
      wrangler-version:
        description: 'local uses the locked workspace installation; otherwise specify an exact version.'
        required: false
        type: string
        default: local
      wrangler-environment:
        required: false
        type: string
        default: ''
      wrangler-config:
        required: false
        type: string
        default: ''
      production-url:
        required: false
        type: string
        default: ''
      canary-verify-command:
        description: 'Required JSON argv when canary-percentage is below 100; must prove the live request served this version.'
        required: false
        type: string
        default: ''
      smoke-path:
        required: false
        type: string
        default: '/'
      binding-policy-file:
        description: 'Optional reviewed binding policy; undeclared stateful bindings fail closed.'
        required: false
        type: string
        default: ''
      canary-percentage:
        description: '100 promotes directly; a lower value verifies a canary before final promotion.'
        required: false
        type: number
        default: 100
      auto-rollback:
        description: 'Requires explicit rollbackSafe policy and no stateful bindings. Never restores resource data.'
        required: false
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
    outputs:
      preview-url:
        value: ${{ jobs.candidate.outputs.url }}
      version-id:
        value: ${{ jobs.candidate.outputs.version-id }}
      source-sha:
        value: ${{ jobs.candidate.outputs.source-sha }}
      artifact-digest:
        value: ${{ jobs.candidate.outputs.artifact-digest }}
      cloudflare-deployment-id:
        value: ${{ jobs.promote.outputs.cloudflare-deployment-id }}
      github-deployment-id:
        value: ${{ jobs.promote.outputs.github-deployment-id || jobs.candidate.outputs.github-deployment-id }}

permissions:
  contents: read
  deployments: write

# All production deliveries for an application serialize; old commits are checked
# again after environment approval. Never cancel a deployment mid-promotion.
concurrency:
  group: code-foundry-cloudflare-${{ github.repository }}-${{ inputs.worker-name }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  candidate:
    if: >-
      vars.CI_BILLING_PAUSED != 'true' &&
      (inputs['draft-protection'] != true || github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'pull_request' || inputs.mode != 'preview' || !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main')) &&
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The explicit deployment record below is the sole GitHub deployment record.
    # Keep the environment for approvals, secrets, and branch protection without
    # creating a second, competing PR timeline entry.
    environment:
      name: Preview
      deployment: false
      url: ${{ steps.upload.outputs.url }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      FOUNDRY_MODE: ${{ inputs.mode }}
      FOUNDRY_WORKER: ${{ inputs.worker-name }}
      FOUNDRY_PHASE: candidate
      FOUNDRY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ARTIFACT_PATH: ${{ inputs.artifact-path }}
      VERIFY_COMMAND: ${{ inputs.verify-command }}
      SMOKE_PATH: ${{ inputs.smoke-path }}
      WRANGLER_VERSION: ${{ inputs.wrangler-version }}
      WRANGLER_ENVIRONMENT: ${{ inputs.wrangler-environment }}
      WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
      BINDING_POLICY_FILE: ${{ inputs.binding-policy-file }}
      DEPLOYMENT_ENVIRONMENT: Preview
    outputs:
      url: ${{ steps.upload.outputs.url }}
      version-id: ${{ steps.upload.outputs.version-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      source-sha: ${{ steps.upload.outputs.source-sha }}
      verified: ${{ steps.verify.outputs.verified }}
      github-deployment-id: ${{ steps.start.outputs.github-deployment-id }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate inputs
        env:
          RUNTIME_REF: ${{ inputs.runtime-ref }}
          CANARY_PERCENTAGE: ${{ inputs.canary-percentage }}
          CANARY_VERIFY_COMMAND: ${{ inputs.canary-verify-command }}
          PRODUCTION_URL: ${{ inputs.production-url }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$FOUNDRY_MODE" == preview || "$FOUNDRY_MODE" == production ]]
          node --input-type=module <<'NODE'
          const percentage = Number(process.env.CANARY_PERCENTAGE)
          if (!Number.isFinite(percentage) || percentage < 0.01 || percentage > 100 || (percentage < 100 && percentage > 99.99)) process.exit(1)
          if (process.env.FOUNDRY_MODE === 'production' && percentage < 100) {
            let argv
            try { argv = JSON.parse(process.env.CANARY_VERIFY_COMMAND ?? '') } catch { process.exit(1) }
            if (!Array.isArray(argv) || !argv.length || argv.some((arg) => typeof arg !== 'string' || !arg.length || arg.includes('\0'))) process.exit(1)
          }
          NODE
          if [[ "$FOUNDRY_MODE" == production ]]; then
            [[ "$GITHUB_REF" == "refs/heads/$FOUNDRY_DEFAULT_BRANCH" ]]
            [[ "$PRODUCTION_URL" == https://* ]]
          fi
      - name: Checkout delivery runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 0xPlayerOne/code-foundry
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry-delivery
          persist-credentials: false
          sparse-checkout: src
      - name: Prepare delivery state
        run: |
          echo "FOUNDRY_EXECUTOR=$GITHUB_WORKSPACE/.github/.code-foundry-delivery/src/commands/cloudflare-delivery.mjs" >> "$GITHUB_ENV"
          echo "FOUNDRY_STATE_FILE=$RUNNER_TEMP/cloudflare-candidate.json" >> "$GITHUB_ENV"
      - name: Record pending application deployment
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEPLOYMENT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node "$FOUNDRY_EXECUTOR" record-start
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Install locked dependencies
        working-directory: ${{ inputs.install-working-directory }}
        run: bun install --frozen-lockfile
      - name: Build candidate
        if: inputs.build-script != ''
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: bun run "$BUILD_SCRIPT"
      - name: Reject stale production source
        if: inputs.mode == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$FOUNDRY_EXECUTOR" assert-current
      - name: Upload candidate without changing traffic
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$FOUNDRY_EXECUTOR" upload
      - name: Inspect actual candidate bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$FOUNDRY_EXECUTOR" inspect
      - name: Verify candidate
        id: verify
        run: node "$FOUNDRY_EXECUTOR" verify
      - name: Complete application deployment status
        if: always() && steps.start.outputs.github-deployment-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_STATUS: ${{ job.status }}
        run: node "$FOUNDRY_EXECUTOR" record-finish
      - name: Preserve candidate evidence
        if: always() && steps.start.outputs.github-deployment-id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-candidate-${{ inputs.worker-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloudflare-candidate.json
          if-no-files-found: error
          retention-days: 14

  promote:
    needs: candidate
    if: >-
      vars.CI_BILLING_PAUSED != 'true' &&
      (inputs['draft-protection'] != true || github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      inputs.mode == 'production' && needs.candidate.outputs.verified == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Production
      deployment: false
      url: ${{ inputs.production-url }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      FOUNDRY_MODE: production
      FOUNDRY_PHASE: production
      FOUNDRY_WORKER: ${{ inputs.worker-name }}
      FOUNDRY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      VERIFY_COMMAND: ${{ inputs.verify-command }}
      SMOKE_PATH: ${{ inputs.smoke-path }}
      PRODUCTION_URL: ${{ inputs.production-url }}
      BINDING_POLICY_FILE: ${{ inputs.binding-policy-file }}
      DEPLOYMENT_ENVIRONMENT: Production
      AUTO_ROLLBACK: ${{ inputs.auto-rollback }}
    outputs:
      cloudflare-deployment-id: ${{ steps.promote.outputs.cloudflare-deployment-id || steps.canary.outputs.cloudflare-deployment-id }}
      github-deployment-id: ${{ steps.start.outputs.github-deployment-id }}
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.source-sha }}
          persist-credentials: false
      - name: Checkout delivery runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 0xPlayerOne/code-foundry
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry-delivery
          persist-credentials: false
          sparse-checkout: src
      - name: Prepare production state
        run: |
          echo "FOUNDRY_EXECUTOR=$GITHUB_WORKSPACE/.github/.code-foundry-delivery/src/commands/cloudflare-delivery.mjs" >> "$GITHUB_ENV"
          echo "FOUNDRY_STATE_FILE=$RUNNER_TEMP/cloudflare-production.json" >> "$GITHUB_ENV"
      - name: Bind promotion to verified candidate
        env:
          CANDIDATE_VERIFIED: ${{ needs.candidate.outputs.verified }}
          CANDIDATE_SOURCE_SHA: ${{ needs.candidate.outputs.source-sha }}
          CANDIDATE_VERSION_ID: ${{ needs.candidate.outputs.version-id }}
          CANDIDATE_URL: ${{ needs.candidate.outputs.url }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.candidate.outputs.artifact-digest }}
        run: node "$FOUNDRY_EXECUTOR" init-production
      - name: Record pending application deployment
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEPLOYMENT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node "$FOUNDRY_EXECUTOR" record-start
      - name: Set up Bun for verification only
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Install verification dependencies without rebuilding
        working-directory: ${{ inputs.install-working-directory }}
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Reject stale source after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$FOUNDRY_EXECUTOR" assert-current
      - name: Activate canary
        id: canary
        if: inputs.canary-percentage < 100
        env:
          DEPLOY_PERCENTAGE: ${{ inputs.canary-percentage }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$FOUNDRY_EXECUTOR" activate
      - name: Verify canary
        if: inputs.canary-percentage < 100
        env:
          FOUNDRY_PHASE: canary
          VERIFY_COMMAND: ${{ inputs.canary-verify-command }}
        run: node "$FOUNDRY_EXECUTOR" verify
      - name: Recheck source before final promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$FOUNDRY_EXECUTOR" assert-current
      - name: Promote the verified version to 100 percent
        id: promote
        env:
          DEPLOY_PERCENTAGE: '100'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$FOUNDRY_EXECUTOR" activate
      - name: Verify production
        run: node "$FOUNDRY_EXECUTOR" verify
      - name: Optional stateless rollback
        if: >-
          failure() && inputs.auto-rollback &&
          (steps.canary.outcome == 'success' || steps.promote.outcome == 'success')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$FOUNDRY_EXECUTOR" rollback
      - name: Complete application deployment status
        if: always() && steps.start.outputs.github-deployment-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_STATUS: ${{ job.status }}
        run: node "$FOUNDRY_EXECUTOR" record-finish
      - name: Preserve promotion and recovery evidence
        if: always() && steps.start.outputs.github-deployment-id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-production-${{ inputs.worker-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloudflare-production.json
          if-no-files-found: error
          retention-days: 30
