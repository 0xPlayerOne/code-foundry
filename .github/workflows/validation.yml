name: Code Foundry Validation

on:
  workflow_call:
    inputs:
      mode:
        description: Validation tier (fast, audit, or release).
        required: true
        type: string
      release-qualification-receipts:
        description: Reuse a recent exact-tree audit receipt for Release Please PRs.
        required: false
        type: boolean
        default: false
      runtime-repository:
        description: Repository containing the Code Foundry runtime.
        required: false
        type: string
        default: 0xPlayerOne/code-foundry
      runtime-ref:
        description: Code Foundry runtime tag or ref.
        required: false
        type: string
        default: v1.0.5
      ci-runner:
        description: Runner used by CI jobs.
        required: false
        type: string
        default: ubuntu-latest
      test-runner:
        description: Runner used by non-unit test jobs.
        required: false
        type: string
        default: ubuntu-latest
      unit-runner:
        description: Runner used by unit tests.
        required: false
        type: string
        default: ubuntu-slim
      performance-runner:
        description: Runner used by deterministic performance regression checks.
        required: false
        type: string
        default: ubuntu-latest
      security-runner:
        description: Runner used by Security jobs.
        required: false
        type: string
        default: ubuntu-slim
      eval-runner:
        description: >-
          Runner used by the eval harness. Browser evals need a
          Chrome-capable runner such as ubuntu-latest; ubuntu-slim does not
          ship a browser.
        required: false
        type: string
        default: ubuntu-latest
      codeql-runner:
        description: Runner used by CodeQL jobs.
        required: false
        type: string
        default: ubuntu-latest
      rust-shards:
        description: JSON array of Rust scope sharding values. Use ["all"] for single-pass behavior.
        required: false
        type: string
        default: '["all"]'
      rust-threads:
        description: Threads used for Rust extraction and analysis. Values above 1 opt into local parallelism.
        required: false
        type: string
        default: '1'
      rust-max-parallel:
        description: Maximum Rust shard jobs allowed to run concurrently.
        required: false
        type: number
        default: 1
      integration-total-shards:
        description: Integration partitions (1 or 2); sharded scripts must honor INTEGRATION_SHARD_INDEX and INTEGRATION_TOTAL_SHARDS.
        required: false
        type: string
        default: '1'
      e2e-shard-list:
        description: Comma-separated E2E shard indices passed to the test lane's matrix, e.g. "1,2".
        required: false
        type: string
        default: '1'
      e2e-total-shards:
        description: Total E2E shard count passed to the repository script as E2E_TOTAL_SHARDS.
        required: false
        type: string
        default: '1'
      idle-lanes:
        description: >-
          Comma-separated lanes the caller's planner found no entrypoint for
          (integration, e2e, smoke, performance, eval). Their jobs are
          skipped instead of allocating a runner for a no-op. Empty runs every
          lane.
        required: false
        type: string
        default: ''
      artifact-prefix:
        description: Prefix for task receipts; use a unique value when calling this workflow more than once.
        required: false
        type: string
        default: task-result
    secrets:
      TURBO_TOKEN:
        required: false
      NEXTAUTH_SECRET:
        required: false

# The orchestrator keeps the union of permissions needed by the chain it calls
# (CodeQL uploads require security-events: write). Nested reusable workflows
# can only maintain or reduce permissions, never elevate them.
permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read
  security-events: write

jobs:
  qualification:
    name: Qualification
    if: >-
      vars.CI_BILLING_PAUSED != 'true' &&
      inputs.release-qualification-receipts == true && inputs.mode == 'release'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/qualification-receipt.yml
    with:
      phase: verify
      mode: ${{ inputs.mode }}
      enabled: ${{ inputs.release-qualification-receipts }}
      codeql-enabled: true
      runtime-repository: ${{ inputs.runtime-repository }}
      runtime-ref: ${{ inputs.runtime-ref }}
      required-job-names-json: '["Validation / Gate"]'

  ci:
    name: CI
    needs: qualification
    if: >-
      !cancelled() && vars.CI_BILLING_PAUSED != 'true' &&
      (inputs.mode == 'fast' || inputs.mode == 'audit' || inputs.mode == 'release')
    # Type-Check reads the issue-backed requirements ledger with github.token.
    permissions:
      actions: read
      contents: read
      issues: read
      packages: read
    uses: ./.github/workflows/ci.yml
    with:
      runtime-repository: ${{ inputs.runtime-repository }}
      runtime-ref: ${{ inputs.runtime-ref }}
      runner: ${{ inputs.ci-runner }}
      artifact-prefix: ${{ inputs.artifact-prefix }}
      release-build-only: ${{ inputs.mode == 'release' && needs.qualification.outputs.reuse == 'true' }}
      release-package-check: ${{ inputs.mode == 'release' && needs.qualification.outputs.reuse == 'true' }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

  test:
    name: Test
    needs: qualification
    if: >-
      !cancelled() && vars.CI_BILLING_PAUSED != 'true' &&
      (inputs.mode == 'fast' || inputs.mode == 'audit' ||
      (inputs.mode == 'release' && needs.qualification.outputs.reuse != 'true'))
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/test.yml
    with:
      runtime-repository: ${{ inputs.runtime-repository }}
      runtime-ref: ${{ inputs.runtime-ref }}
      runner: ${{ inputs.test-runner }}
      unit-runner: ${{ inputs.unit-runner }}
      performance-runner: ${{ inputs.performance-runner }}
      # Fast and Release Please pull requests run unit tests only. Until a
      # successful full qualification is verifiable for the exact main tree,
      # release mode keeps its CI and unit-test fallback.
      unit-only: ${{ inputs.mode == 'fast' || inputs.mode == 'release' }}
      artifact-prefix: ${{ inputs.artifact-prefix }}
      integration-total-shards: ${{ inputs.integration-total-shards }}
      e2e-shard-list: ${{ inputs.e2e-shard-list }}
      e2e-total-shards: ${{ inputs.e2e-total-shards }}
      idle-lanes: ${{ inputs.idle-lanes }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  security:
    name: Security
    if: vars.CI_BILLING_PAUSED != 'true' && inputs.mode == 'audit'
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml
    with:
      runtime-repository: ${{ inputs.runtime-repository }}
      runtime-ref: ${{ inputs.runtime-ref }}
      runner: ${{ inputs.security-runner }}

  codeql:
    name: CodeQL
    # Release-please pull requests also analyze with CodeQL so repository
    # rulesets requiring code scanning results never deadlock the release.
    if: vars.CI_BILLING_PAUSED != 'true' && (inputs.mode == 'audit' || inputs.mode == 'release')
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      runtime-repository: ${{ inputs.runtime-repository }}
      runtime-ref: ${{ inputs.runtime-ref }}
      runner: ${{ inputs.codeql-runner }}
      rust-shards: ${{ inputs.rust-shards }}
      rust-threads: ${{ inputs.rust-threads }}
      rust-max-parallel: ${{ inputs.rust-max-parallel }}

  eval:
    name: Eval
    # Behavior evals are part of audit qualification. A release-only run may
    # reuse that work only through the exact, unexpired source receipt below.
    # The reusable workflow skips cleanly when there is no eval harness.
    if: vars.CI_BILLING_PAUSED != 'true' && inputs.mode == 'audit'
    permissions:
      contents: read
    uses: ./.github/workflows/eval.yml
    with:
      runtime-repository: ${{ inputs.runtime-repository }}
      runtime-ref: ${{ inputs.runtime-ref }}
      runner: ${{ inputs.eval-runner }}
      artifact-prefix: ${{ inputs.artifact-prefix }}
      idle-lanes: ${{ inputs.idle-lanes }}

  # Aggregate check: "Validation / Gate" (caller job name + this job name).
  # Always evaluates; only jobs required for the mode must have succeeded.
  # Release Please branches require CI, CodeQL, and the exact generated-diff
  # audit below. The runtime gate also requires unit tests unless the separate
  # qualification job verified a matching source receipt. Ordinary PRs still
  # render no skipped release-policy row.
  gate:
    name: Gate
    needs: [ci, test, security, codeql, eval, qualification]
    if: vars.CI_BILLING_PAUSED != 'true' && always()
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      FOUNDRY_MODE: ${{ inputs.mode }}
      FOUNDRY_CI: ${{ needs.ci.result }}
      FOUNDRY_TEST: ${{ needs.test.result }}
      FOUNDRY_SECURITY: ${{ needs.security.result }}
      FOUNDRY_CODEQL: ${{ needs.codeql.result }}
      # An eval lane the caller planned as idle (no eval script, no
      # eval_command, or eval: false) never starts, so the whole Eval
      # workflow reports skipped. Count that exactly like the no-op success
      # it reported before; any other skip still fails the gate.
      FOUNDRY_EVAL: ${{ (needs.eval.result == 'skipped' && contains(format(',{0},', inputs.idle-lanes), ',eval,') && 'success') || needs.eval.result }}
      FOUNDRY_SOURCE_QUALIFICATION: ${{ needs.qualification.outputs.reuse }}
      FOUNDRY_QUALIFICATION: ${{ needs.qualification.result }}
    steps:
      - name: Checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            src/lib
            src/runtime-core.mjs
            src/runtime.mjs
      - name: Install runtime
        run: mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
      - name: Checkout consumer repository
        if: ${{ inputs.mode == 'release' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The content audit needs historical blobs after checkout removes credentials.
          fetch-depth: 0
      - name: Validate generated release diff
        if: ${{ inputs.mode == 'release' }}
        env:
          FOUNDRY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FOUNDRY_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          FOUNDRY_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          FOUNDRY_REPOSITORY: ${{ github.repository }}
        run: node "$RUNNER_TEMP/code-foundry/src/runtime.mjs" validation release_diff
      - name: Evaluate aggregate gate
        run: node "$RUNNER_TEMP/code-foundry/src/runtime.mjs" validation gate

  qualification-receipt:
    name: Qualification receipt
    needs: [ci, test, security, codeql, eval, gate]
    if: >-
      !cancelled() && vars.CI_BILLING_PAUSED != 'true' && inputs.mode == 'audit' &&
      inputs.release-qualification-receipts == true &&
      github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
      needs.ci.result == 'success' && needs.test.result == 'success' &&
      needs.security.result == 'success' && needs.codeql.result == 'success' &&
      (needs.eval.result == 'success' ||
      (needs.eval.result == 'skipped' && contains(format(',{0},', inputs.idle-lanes), ',eval,'))) &&
      needs.gate.result == 'success'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/qualification-receipt.yml
    with:
      phase: produce
      mode: ${{ inputs.mode }}
      enabled: ${{ inputs.release-qualification-receipts }}
      codeql-enabled: true
      runtime-repository: ${{ inputs.runtime-repository }}
      runtime-ref: ${{ inputs.runtime-ref }}
      job-results-json: >-
        {"ci":"${{ needs.ci.result }}","test":"${{ needs.test.result }}","security":"${{ needs.security.result }}","codeql":"${{ needs.codeql.result }}","eval":"${{ (needs.eval.result == 'skipped' && contains(format(',{0},', inputs.idle-lanes), ',eval,') && 'success') || needs.eval.result }}","gate":"${{ needs.gate.result }}"}
      required-job-names-json: '["Validation / Gate"]'
