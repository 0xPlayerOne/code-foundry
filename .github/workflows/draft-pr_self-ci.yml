name: Code Foundry

on:
  push:
    branches:
      - 'feat/*'
      - 'fix/*'
      - 'chore/*'
      - 'refactor/*'
      - 'docs/*'
      - 'style/*'
      - 'test/*'

permissions:
  contents: read
  pull-requests: write

jobs:
  draft-pr:
    name: Draft PR
    uses: ./.github/workflows/draft-pr.yml
    with:
      runner: ubuntu-slim
    secrets: inherit
