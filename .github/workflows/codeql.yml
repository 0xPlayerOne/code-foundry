name: Code Foundry CodeQL

on:
  workflow_call:
    inputs:
      runtime-repository:
        description: Repository containing the Code Foundry runtime.
        required: false
        type: string
        default: 0xPlayerOne/code-foundry
      runtime-ref:
        description: Code Foundry runtime tag or ref.
        required: false
        type: string
        default: v1.0.5
      runner:
        description: Runner used by CodeQL jobs.
        required: false
        type: string
        default: ubuntu-latest
      rust-shards:
        description: JSON array of Rust scope sharding values. Use ["all"] for single-pass behavior.
        required: false
        type: string
        default: '["all"]'
      rust-threads:
        description: Threads used for Rust extraction and analysis. Values above 1 opt into local parallelism.
        required: false
        type: string
        default: '1'
      rust-max-parallel:
        description: Maximum Rust shard jobs allowed to run concurrently.
        required: false
        type: number
        default: 1
        # Retained for caller compatibility. Rust shards share the single
        # analysis matrix, so no separate throttle applies.
permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

# Analyzers run only for detected languages: a single analysis matrix is
# built from detection (Rust shards expand inline), so repositories never
# see checks — not even skipped ones — for languages they do not use. An
# empty matrix while analysis is enabled fails the build closed.
env:
  REPO_FOUNDRY_PROFILE: ${{ vars.REPO_FOUNDRY_PROFILE }}
  REPO_FOUNDRY_LANGUAGES: ${{ vars.REPO_FOUNDRY_LANGUAGES }}
  REPO_FOUNDRY_FEATURES: ${{ vars.REPO_FOUNDRY_FEATURES }}

concurrency:
  group: code-foundry-codeql-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect
    if: vars.CI_BILLING_PAUSED != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      languages: ${{ steps.languages.outputs.languages }}
      enabled: ${{ steps.languages.outputs.enabled }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      code_security: ${{ steps.security.outputs.status }}
      actions_available: ${{ steps.languages.outputs.actions_available }}
      actions_changed: ${{ steps.languages.outputs.actions_changed }}
      actions_build_mode: ${{ steps.languages.outputs.actions_build_mode }}
      javascript_available: ${{ steps.languages.outputs.javascript_available }}
      javascript_changed: ${{ steps.languages.outputs.javascript_changed }}
      javascript_build_mode: ${{ steps.languages.outputs.javascript_build_mode }}
      python_available: ${{ steps.languages.outputs.python_available }}
      python_changed: ${{ steps.languages.outputs.python_changed }}
      python_build_mode: ${{ steps.languages.outputs.python_build_mode }}
      rust_available: ${{ steps.languages.outputs.rust_available }}
      rust_changed: ${{ steps.languages.outputs.rust_changed }}
      rust_build_mode: ${{ steps.languages.outputs.rust_build_mode }}
    steps:
      - name: Detect Code Security
        id: security
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          status="disabled"
          if [ "$REPOSITORY_VISIBILITY" = "public" ]; then
            status="enabled"
          else
            status="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.security_and_analysis.code_security.status // "disabled"' 2>/dev/null || printf 'disabled')"
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github
            .mise.toml
            mise.lock
            package.json
            bun.lock
            bun.lockb
            pnpm-lock.yaml
            yarn.lock
            package-lock.json
          sparse-checkout-cone-mode: false
      - name: Runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions
            src/lib
            src/runtime.mjs
      - name: Install runtime
        run: |
          mkdir -p .github/actions
          mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
          cp -R "$RUNNER_TEMP/code-foundry/.github/actions/." .github/actions/
      - id: languages
        name: Detect languages
        env:
          CODEQL_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          REPO_FOUNDRY_CODE_SECURITY: ${{ steps.security.outputs.status }}
          REPO_FOUNDRY_PRIVATE: ${{ github.event.repository.private }}
          REPO_FOUNDRY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: node $RUNNER_TEMP/code-foundry/src/runtime.mjs codeql
      - id: matrix
        name: Build analysis matrix
        env:
          MATRIX_ENABLED: ${{ steps.languages.outputs.enabled }}
          MATRIX_LANGUAGES: ${{ steps.languages.outputs.languages }}
          MATRIX_SHARDS: ${{ inputs.rust-shards }}
        run: |
          node -e '
          const fs = require("node:fs");
          const out = process.env.GITHUB_OUTPUT;
          function append(name, value) { fs.appendFileSync(out, name + "=" + value + "\n"); }
          const enabled = process.env.MATRIX_ENABLED === "true";
          if (!enabled) {
            append("matrix", "[]");
          } else {
            const languages = JSON.parse(process.env.MATRIX_LANGUAGES || "[]");
            const shards = JSON.parse(process.env.MATRIX_SHARDS || "[\"all\"]");
            const display = { actions: "Actions", "javascript-typescript": "TypeScript", python: "Python" };
            const matrix = languages
              .filter((entry) => entry.language !== "rust")
              .map((entry) => ({
                display: display[entry.language] || entry.language,
                language: entry.language,
                category: "/language/" + entry.language,
                build_mode: entry["build-mode"] || "none",
                changed: entry.changed === true,
              }));
            const rust = languages.find((entry) => entry.language === "rust");
            for (const shard of rust ? shards : []) {
              matrix.push({
                display: String(shard) === "all" ? "Rust" : "Rust (" + shard + ")",
                language: "rust",
                category: "/language/rust",
                build_mode: "none",
                changed: rust.changed === true,
                shard: String(shard),
              });
            }
            if (!matrix.length) {
              console.error("CodeQL analysis matrix is empty while analysis is enabled.");
              process.exit(1);
            }
            append("matrix", JSON.stringify(matrix));
          }
          '

  analyze:
    name: Analyze (${{ matrix.entry.display }})
    needs: detect
    if: vars.CI_BILLING_PAUSED != 'true' && needs.detect.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.detect.outputs.matrix || '[]') }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        if: ${{ matrix.entry.changed == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runtime
        if: ${{ matrix.entry.changed == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions
            src/lib
            src/runtime.mjs
      - name: Install runtime
        if: ${{ matrix.entry.changed == true }}
        run: |
          mkdir -p .github/actions
          mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
          cp -R "$RUNNER_TEMP/code-foundry/.github/actions/." .github/actions/
      - name: Analyze
        if: ${{ matrix.entry.changed == true && matrix.entry.language != 'rust' }}
        uses: ./.github/actions/codeql
        with:
          language: ${{ matrix.entry.language }}
          build-mode: ${{ matrix.entry.build_mode }}
          category: ${{ matrix.entry.category }}
      - name: Configure Rust scope
        if: ${{ matrix.entry.changed == true && matrix.entry.language == 'rust' }}
        id: scope
        env:
          RUST_SCOPE: ${{ matrix.entry.shard }}
        run: |
          set -euo pipefail
          scope="$RUST_SCOPE"
          scope_id="$(node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update(process.argv[1]).digest("hex").slice(0, 12))' "$scope")"
          config_file="$GITHUB_WORKSPACE/.github/codeql-rust-$scope_id.yml"
          cat > "$config_file" <<'EOF'
          name: code-foundry-rust
          EOF
          if [ "$scope" != "all" ]; then
            IFS=',' read -ra paths <<< "$scope"
            if [ "${#paths[@]}" -eq 0 ]; then
              echo "Empty Rust scope shard for CodeQL"
              exit 1
            fi
            echo "paths:" >> "$config_file"
            for path in "${paths[@]}"; do
              path="${path#"${path%%[![:space:]]*}"}"
              path="${path%"${path##*[![:space:]]}"}"
              if [ -z "$path" ] ||
                 [[ "$path" = /* ]] ||
                 [[ "/$path/" = *"/../"* ]] ||
                 [[ ! "$path" =~ ^[A-Za-z0-9._/@+\ -]+$ ]]; then
                echo "Invalid Rust CodeQL shard path: $path" >&2
                exit 1
              fi
              if ! git ls-files -- "$path" | grep -Eq '(^|/)(Cargo\.toml|[^/]+\.rs)$'; then
                echo "Rust CodeQL shard path contains no tracked Rust source: $path" >&2
                exit 1
              fi
              printf "  - '%s'\n" "$path" >> "$config_file"
            done
          fi
          if [ -f Cargo.toml ] && grep -q '^paths:' "$config_file"; then
            printf "  - 'Cargo.toml'\n" >> "$config_file"
          fi
          if [ -f Cargo.lock ] && grep -q '^paths:' "$config_file"; then
            printf "  - 'Cargo.lock'\n" >> "$config_file"
          fi
          if [ -f rust-toolchain.toml ] && grep -q '^paths:' "$config_file"; then
            printf "  - 'rust-toolchain.toml'\n" >> "$config_file"
          fi
          echo "config_file=$config_file" >> "$GITHUB_OUTPUT"
          echo "scope_id=$scope_id" >> "$GITHUB_OUTPUT"
      - name: Initialize
        if: ${{ matrix.entry.changed == true && matrix.entry.language == 'rust' }}
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: rust
          build-mode: ${{ needs.detect.outputs.rust_build_mode }}
          config-file: ${{ steps.scope.outputs.config_file }}
          threads: ${{ inputs.rust-threads }}
      - name: Analyze Rust
        if: ${{ matrix.entry.changed == true && matrix.entry.language == 'rust' }}
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:rust/${{ steps.scope.outputs.scope_id }}
          upload-database: false
          wait-for-processing: false
      - name: Not applicable
        if: ${{ matrix.entry.changed != true }}
        run: echo "CodeQL ${{ matrix.entry.display }} analysis is not applicable to this change."
