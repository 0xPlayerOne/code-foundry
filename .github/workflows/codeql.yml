name: Code Foundry CodeQL

on:
  workflow_call:
    inputs:
      runtime-repository:
        description: Repository containing the Code Foundry runtime.
        required: false
        type: string
        default: 0xPlayerOne/code-foundry
      runtime-ref:
        description: Code Foundry runtime tag or ref.
        required: false
        type: string
        default: v0.31.12
      runner:
        description: Runner used by CodeQL jobs.
        required: false
        type: string
        default: ubuntu-latest
      rust-shards:
        description: JSON array of Rust scope sharding values. Use ["all"] for single-pass behavior.
        required: false
        type: string
        default: '["all"]'
      rust-threads:
        description: CODEQL_THREADS value used during Rust extraction.
        required: false
        type: string
        default: '1'

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

# Every analyzer emits a successful check, including when its language is not applicable.
env:
  REPO_FOUNDRY_PROFILE: ${{ vars.REPO_FOUNDRY_PROFILE }}
  REPO_FOUNDRY_LANGUAGES: ${{ vars.REPO_FOUNDRY_LANGUAGES }}
  REPO_FOUNDRY_FEATURES: ${{ vars.REPO_FOUNDRY_FEATURES }}

concurrency:
  group: code-foundry-codeql-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      languages: ${{ steps.languages.outputs.languages }}
      enabled: ${{ steps.languages.outputs.enabled }}
      code_security: ${{ steps.security.outputs.status }}
      actions_available: ${{ steps.languages.outputs.actions_available }}
      actions_changed: ${{ steps.languages.outputs.actions_changed }}
      actions_build_mode: ${{ steps.languages.outputs.actions_build_mode }}
      javascript_available: ${{ steps.languages.outputs.javascript_available }}
      javascript_changed: ${{ steps.languages.outputs.javascript_changed }}
      javascript_build_mode: ${{ steps.languages.outputs.javascript_build_mode }}
      python_available: ${{ steps.languages.outputs.python_available }}
      python_changed: ${{ steps.languages.outputs.python_changed }}
      python_build_mode: ${{ steps.languages.outputs.python_build_mode }}
      rust_available: ${{ steps.languages.outputs.rust_available }}
      rust_changed: ${{ steps.languages.outputs.rust_changed }}
      rust_build_mode: ${{ steps.languages.outputs.rust_build_mode }}
    steps:
      - name: Detect Code Security
        id: security
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="disabled"
          if [ "${{ github.event.repository.visibility }}" = "public" ]; then
            status="enabled"
          else
            status="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.security_and_analysis.code_security.status // "disabled"' 2>/dev/null || printf 'disabled')"
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github
            .mise.toml
            mise.lock
            package.json
            bun.lock
            bun.lockb
            pnpm-lock.yaml
            yarn.lock
            package-lock.json
          sparse-checkout-cone-mode: false
      - name: Runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions
            src/lib
            src/runtime.mjs
      - name: Install runtime
        run: |
          mkdir -p .github/actions
          mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
          cp -R "$RUNNER_TEMP/code-foundry/.github/actions/." .github/actions/
      - id: languages
        name: Detect languages
        env:
          CODEQL_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          REPO_FOUNDRY_CODE_SECURITY: ${{ steps.security.outputs.status }}
          REPO_FOUNDRY_PRIVATE: ${{ github.event.repository.private }}
          REPO_FOUNDRY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: node $RUNNER_TEMP/code-foundry/src/runtime.mjs codeql

  analyze-actions:
    name: Analyze (Actions)
    needs: detect
    if: >-
      needs.detect.outputs.enabled == 'true' &&
      needs.detect.outputs.actions_available == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.actions_available == 'true' &&
          needs.detect.outputs.actions_changed == 'true'
        uses: actions/checkout@v7
      - name: Runtime
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.actions_available == 'true' &&
          needs.detect.outputs.actions_changed == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions
            src/lib
            src/runtime.mjs
      - name: Install runtime
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.actions_available == 'true' &&
          needs.detect.outputs.actions_changed == 'true'
        run: |
          mkdir -p .github/actions
          mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
          cp -R "$RUNNER_TEMP/code-foundry/.github/actions/." .github/actions/
      - name: Analyze
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.actions_available == 'true' &&
          needs.detect.outputs.actions_changed == 'true'
        uses: ./.github/actions/codeql
        with:
          language: actions
          build-mode: ${{ needs.detect.outputs.actions_build_mode }}
          category: /language:actions
      - name: Not applicable
        if: >-
          needs.detect.outputs.enabled != 'true' ||
          needs.detect.outputs.actions_available != 'true' ||
          needs.detect.outputs.actions_changed != 'true'
        run: echo "CodeQL Actions analysis is not applicable to this change."

  analyze-typescript:
    name: Analyze (TypeScript)
    needs: detect
    if: >-
      needs.detect.outputs.enabled == 'true' &&
      needs.detect.outputs.javascript_available == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.javascript_available == 'true' &&
          needs.detect.outputs.javascript_changed == 'true'
        uses: actions/checkout@v7
      - name: Runtime
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.javascript_available == 'true' &&
          needs.detect.outputs.javascript_changed == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions
            src/lib
            src/runtime.mjs
      - name: Install runtime
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.javascript_available == 'true' &&
          needs.detect.outputs.javascript_changed == 'true'
        run: |
          mkdir -p .github/actions
          mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
          cp -R "$RUNNER_TEMP/code-foundry/.github/actions/." .github/actions/
      - name: Analyze
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.javascript_available == 'true' &&
          needs.detect.outputs.javascript_changed == 'true'
        uses: ./.github/actions/codeql
        with:
          language: javascript-typescript
          build-mode: ${{ needs.detect.outputs.javascript_build_mode }}
          category: /language:javascript-typescript
      - name: Not applicable
        if: >-
          needs.detect.outputs.enabled != 'true' ||
          needs.detect.outputs.javascript_available != 'true' ||
          needs.detect.outputs.javascript_changed != 'true'
        run: echo "CodeQL TypeScript analysis is not applicable to this change."

  analyze-python:
    name: Analyze (Python)
    needs: detect
    if: >-
      needs.detect.outputs.enabled == 'true' &&
      needs.detect.outputs.python_available == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.python_available == 'true' &&
          needs.detect.outputs.python_changed == 'true'
        uses: actions/checkout@v7
      - name: Runtime
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.python_available == 'true' &&
          needs.detect.outputs.python_changed == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions
            src/lib
            src/runtime.mjs
      - name: Install runtime
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.python_available == 'true' &&
          needs.detect.outputs.python_changed == 'true'
        run: |
          mkdir -p .github/actions
          mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
          cp -R "$RUNNER_TEMP/code-foundry/.github/actions/." .github/actions/
      - name: Analyze
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.python_available == 'true' &&
          needs.detect.outputs.python_changed == 'true'
        uses: ./.github/actions/codeql
        with:
          language: python
          build-mode: ${{ needs.detect.outputs.python_build_mode }}
          category: /language:python
      - name: Not applicable
        if: >-
          needs.detect.outputs.enabled != 'true' ||
          needs.detect.outputs.python_available != 'true' ||
          needs.detect.outputs.python_changed != 'true'
        run: echo "CodeQL Python analysis is not applicable to this change."

  analyze-rust:
    name: Analyze (Rust)
    needs: detect
    if: >-
      needs.detect.outputs.enabled == 'true' &&
      needs.detect.outputs.rust_available == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(inputs.rust-shards) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.rust_available == 'true' &&
          needs.detect.outputs.rust_changed == 'true'
        uses: actions/checkout@v7
      - name: Runtime
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.rust_available == 'true' &&
          needs.detect.outputs.rust_changed == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.runtime-repository }}
          ref: ${{ inputs.runtime-ref }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions
            src/lib
            src/runtime.mjs
      - name: Install runtime
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.rust_available == 'true' &&
          needs.detect.outputs.rust_changed == 'true'
        run: |
          mkdir -p .github/actions
          mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
          cp -R "$RUNNER_TEMP/code-foundry/.github/actions/." .github/actions/
      - name: Configure Rust scope
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.rust_available == 'true' &&
          needs.detect.outputs.rust_changed == 'true'
        id: scope
        run: |
          scope="${{ matrix.shard }}"
          config_file="$RUNNER_TEMP/codeql-rust-${{ matrix.shard }}.yml"
          cat > "$config_file" <<'EOF'
          name: code-foundry-rust
          EOF
          if [ "$scope" != "all" ]; then
            IFS=',' read -ra paths <<< "$scope"
            if [ "${#paths[@]}" -eq 0 ]; then
              echo "Empty Rust scope shard for CodeQL"
              exit 1
            fi
            echo "paths:" >> "$config_file"
            for path in "${paths[@]}"; do
              [ -z "$path" ] && continue
              printf '  - %s\n' "$path" >> "$config_file"
            done
          fi
          if [ -f Cargo.toml ] && grep -q '^paths:' "$config_file"; then
            printf '  - Cargo.toml\n' >> "$config_file"
          fi
          if [ -f Cargo.lock ] && grep -q '^paths:' "$config_file"; then
            printf '  - Cargo.lock\n' >> "$config_file"
          fi
          if [ -f rust-toolchain.toml ] && grep -q '^paths:' "$config_file"; then
            printf '  - rust-toolchain.toml\n' >> "$config_file"
          fi
          echo "config_file=$config_file" >> "$GITHUB_OUTPUT"
      - name: Initialize
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.rust_available == 'true' &&
          needs.detect.outputs.rust_changed == 'true'
        uses: github/codeql-action/init@v4
        env:
          CODEQL_THREADS: ${{ inputs.rust-threads }}
        with:
          languages: rust
          build-mode: ${{ needs.detect.outputs.rust_build_mode }}
          config-file: ${{ steps.scope.outputs.config_file }}
      - name: Analyze
        if: >-
          needs.detect.outputs.enabled == 'true' &&
          needs.detect.outputs.rust_available == 'true' &&
          needs.detect.outputs.rust_changed == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:rust/${{ matrix.shard }}
          upload-database: false
          wait-for-processing: false
      - name: Not applicable
        if: >-
          needs.detect.outputs.enabled != 'true' ||
          needs.detect.outputs.rust_available != 'true' ||
          needs.detect.outputs.rust_changed != 'true'
        run: echo "CodeQL Rust analysis is not applicable to this change."
