name: CodeQL

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  schedule:
    - cron: "31 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    # Code scanning is unavailable on private GitHub Free/Pro repositories.
    # Keep this job optional there; it becomes active automatically if the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: actions,javascript-typescript,python,rust
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:all
