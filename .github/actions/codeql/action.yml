name: CodeQL Analyze
description: Initialize and analyze one CodeQL language using the repository baseline.

inputs:
  language:
    description: CodeQL language identifier.
    required: true
  build-mode:
    description: CodeQL build mode.
    required: false
    default: none
  category:
    description: CodeQL analysis category.
    required: true

runs:
  using: composite
  steps:
    - name: Initialize
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ inputs.language }}
        build-mode: ${{ inputs.build-mode }}
    - name: Analyze
      uses: github/codeql-action/analyze@v4
      with:
        category: ${{ inputs.category }}
        # Pin pull-request uploads to the contributor's head SHA/ref so a
        # moving merge ref cannot race the required code-scanning context.
        ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
        sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        upload-database: false
        wait-for-processing: false
