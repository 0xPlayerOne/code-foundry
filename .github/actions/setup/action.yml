name: Repository Setup
description: Install the pinned mise toolchain and optionally project dependencies.

inputs:
  install:
    description: Install dependencies for the detected project ecosystems.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Cache installed JavaScript dependencies
      id: javascript-dependencies
      if: inputs.install == 'true' && hashFiles('**/package.json', '**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json', '**/.npmrc', '**/.yarnrc*', '**/.pnpmfile.cjs', '.mise.toml', 'mise.lock') != ''
      uses: actions/cache@v5
      with:
        path: |
          **/node_modules
        key: ${{ runner.os }}-javascript-installed-v2-${{ hashFiles('**/package.json', '**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json', '**/.npmrc', '**/.yarnrc*', '**/.pnpmfile.cjs', '.mise.toml', 'mise.lock') }}
        restore-keys: |
          ${{ runner.os }}-javascript-installed-v2-
    - name: Cache JavaScript packages
      if: inputs.install == 'true' && hashFiles('**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json') != '' && steps.javascript-dependencies.outputs.cache-hit != 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/.bun/install/cache
          ~/.cache/node/corepack
          ~/.npm
          ~/.cache/yarn
          ~/.local/share/pnpm/store
        key: ${{ runner.os }}-javascript-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-javascript-
    - name: Cache JavaScript build state
      if: inputs.install == 'true' && hashFiles('**/next.config.*', '**/vite.config.*', '**/tsconfig*.json', '**/.eslintrc*', '**/eslint.config.*') != ''
      uses: actions/cache@v5
      with:
        path: |
          **/.next/cache
          **/node_modules/.vite
          **/.eslintcache
          **/*.tsbuildinfo
        key: ${{ runner.os }}-javascript-build-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/package.json', '**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json', '**/next.config.*', '**/vite.config.*', '**/tsconfig*.json', '**/.eslintrc*', '**/eslint.config.*', '.mise.toml', 'mise.lock') }}
        restore-keys: |
          ${{ runner.os }}-javascript-build-${{ github.workflow }}-${{ github.job }}-
    - name: Cache Python environment
      id: python-environment
      if: inputs.install == 'true' && hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock', '**/ruff.toml', '.mise.toml', 'mise.lock') != ''
      uses: actions/cache@v5
      with:
        path: |
          .venv
          **/.venv
        key: ${{ runner.os }}-python-environment-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock', '**/ruff.toml', '.mise.toml', 'mise.lock') }}
        restore-keys: |
          ${{ runner.os }}-python-environment-
    - name: Cache Python packages
      if: hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock', '**/ruff.toml') != '' && steps.python-environment.outputs.cache-hit != 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.cache/uv
        key: ${{ runner.os }}-python-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock', '**/ruff.toml') }}
        restore-keys: |
          ${{ runner.os }}-python-
    - name: Cache Turborepo
      if: inputs.install == 'true' && hashFiles('**/turbo.json', '**/turbo.jsonc') != ''
      uses: actions/cache@v5
      with:
        path: |
          .turbo/cache
          **/.turbo/cache
        key: ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/package.json', '**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json', '**/turbo.json', '**/turbo.jsonc', '.mise.toml', 'mise.lock') }}
        restore-keys: |
          ${{ runner.os }}-turbo-
    - name: Cache Rust packages
      id: rust-packages
      if: hashFiles('**/Cargo.toml', '**/Cargo.lock') != ''
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-
    - name: Cache Rust tools
      if: inputs.install != 'true' && hashFiles('**/Cargo.toml', '**/Cargo.lock') != ''
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin
        key: ${{ runner.os }}-rust-tools-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.mise.toml', 'mise.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-tools-
    - name: Cache Rust builds
      if: inputs.install == 'true' && hashFiles('**/Cargo.toml', '**/Cargo.lock') != ''
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-rust-build-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.mise.toml', 'mise.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-build-${{ github.workflow }}-${{ github.job }}-
    - name: Setup
      uses: jdx/mise-action@v4
      with:
        cache: true
    - name: Install
      if: inputs.install == 'true'
      shell: bash
      env:
        REPO_FOUNDRY_JAVASCRIPT_CACHE_HIT: ${{ steps.javascript-dependencies.outputs.cache-hit }}
        REPO_FOUNDRY_PYTHON_CACHE_HIT: ${{ steps.python-environment.outputs.cache-hit }}
        REPO_FOUNDRY_RUST_CACHE_HIT: ${{ steps.rust-packages.outputs.cache-hit }}
      run: bash .github/scripts/ci.sh install
