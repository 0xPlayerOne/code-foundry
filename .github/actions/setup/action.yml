name: Repository Setup
description: Install the pinned mise toolchain and optionally project dependencies.

inputs:
  install:
    description: Install dependencies for the detected project ecosystems.
    required: false
    default: 'false'
  cache-build:
    description: Restore JavaScript framework and incremental compiler caches.
    required: false
    default: 'true'
  cache-lint:
    description: Restore the JavaScript/TypeScript lint cache.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Detect project profile
      id: profile
      shell: bash
      run: |
        has_files() {
          git ls-files -- "$@" | grep -q .
        }

        if [ -f package.json ] || [ -f bun.lock ] || [ -f bun.lockb ] ||
          [ -f pnpm-lock.yaml ] || [ -f yarn.lock ] || [ -f package-lock.json ] ||
          has_files '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.mts' '*.cts'; then
          echo 'javascript=true' >> "$GITHUB_OUTPUT"
        else
          echo 'javascript=false' >> "$GITHUB_OUTPUT"
        fi

        if has_files '*.py' ':!.github/**' || [ -f pyproject.toml ] ||
          [ -f requirements.txt ] || [ -f requirements-dev.txt ]; then
          echo 'python=true' >> "$GITHUB_OUTPUT"
        else
          echo 'python=false' >> "$GITHUB_OUTPUT"
        fi

        if [ -f Cargo.toml ] || [ -f Cargo.lock ]; then
          echo 'rust=true' >> "$GITHUB_OUTPUT"
        else
          echo 'rust=false' >> "$GITHUB_OUTPUT"
        fi

        if [ -f turbo.json ] || [ -f turbo.jsonc ] || has_files '*/turbo.json' '*/turbo.jsonc'; then
          echo 'turbo=true' >> "$GITHUB_OUTPUT"
        else
          echo 'turbo=false' >> "$GITHUB_OUTPUT"
        fi

        if [ -f .eslintrc ] || [ -f .eslintrc.js ] || [ -f .eslintrc.cjs ] ||
          [ -f .eslintrc.json ] || has_files '.eslintrc*' 'eslint.config.*'; then
          echo 'eslint=true' >> "$GITHUB_OUTPUT"
        else
          echo 'eslint=false' >> "$GITHUB_OUTPUT"
        fi

        if has_files 'next.config.*' 'vite.config.*' 'tsconfig*.json'; then
          echo 'build=true' >> "$GITHUB_OUTPUT"
        else
          echo 'build=false' >> "$GITHUB_OUTPUT"
        fi

        if [ -f pyproject.toml ] || [ -f uv.lock ] || [ -f requirements.txt ] ||
          [ -f requirements-dev.txt ] || [ -f Pipfile.lock ] || [ -f poetry.lock ]; then
          echo 'python_dependencies=true' >> "$GITHUB_OUTPUT"
        else
          echo 'python_dependencies=false' >> "$GITHUB_OUTPUT"
        fi

    - name: Cache installed JavaScript dependencies
      id: javascript-dependencies
      if: inputs.install == 'true' && steps.profile.outputs.javascript == 'true' && hashFiles('**/package.json', '**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json', '**/.npmrc', '**/.yarnrc*', '**/.pnpmfile.cjs', '.mise.toml', 'mise.lock') != ''
      uses: actions/cache@v5
      with:
        path: |
          **/node_modules
        key: ${{ runner.os }}-javascript-installed-v2-${{ hashFiles('**/package.json', '**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json', '**/.npmrc', '**/.yarnrc*', '**/.pnpmfile.cjs', '.mise.toml', 'mise.lock') }}
        restore-keys: |
          ${{ runner.os }}-javascript-installed-v2-
    - name: Cache JavaScript packages
      if: inputs.install == 'true' && steps.profile.outputs.javascript == 'true' && hashFiles('**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json') != '' && steps.javascript-dependencies.outputs.cache-hit != 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/.bun/install/cache
          ~/.cache/node/corepack
          ~/.npm
          ~/.cache/yarn
          ~/.local/share/pnpm/store
        key: ${{ runner.os }}-javascript-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-javascript-
    - name: Cache JavaScript lint state
      if: inputs.install == 'true' && inputs.cache-lint == 'true' && steps.profile.outputs.eslint == 'true' && hashFiles('**/.eslintrc*', '**/eslint.config.*') != ''
      uses: actions/cache@v5
      with:
        path: |
          **/.eslintcache
        key: ${{ runner.os }}-javascript-lint-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/package.json', '**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json', '**/.eslintrc*', '**/eslint.config.*', '.mise.toml', 'mise.lock') }}
        restore-keys: |
          ${{ runner.os }}-javascript-lint-${{ github.workflow }}-${{ github.job }}-
    - name: Cache JavaScript build state
      if: inputs.install == 'true' && inputs.cache-build == 'true' && steps.profile.outputs.build == 'true' && hashFiles('**/next.config.*', '**/vite.config.*', '**/tsconfig*.json') != ''
      uses: actions/cache@v5
      with:
        path: |
          **/.next/cache
          **/node_modules/.vite
          **/*.tsbuildinfo
        key: ${{ runner.os }}-javascript-build-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/package.json', '**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json', '**/next.config.*', '**/vite.config.*', '**/tsconfig*.json', '.mise.toml', 'mise.lock') }}
        restore-keys: |
          ${{ runner.os }}-javascript-build-${{ github.workflow }}-${{ github.job }}-
    - name: Cache Python environment
      id: python-environment
      if: inputs.install == 'true' && steps.profile.outputs.python == 'true' && hashFiles('**/pyproject.toml', '**/uv.lock', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock', '**/ruff.toml', '.mise.toml', 'mise.lock') != ''
      uses: actions/cache@v5
      with:
        path: |
          .venv
          **/.venv
        key: ${{ runner.os }}-python-environment-${{ hashFiles('**/pyproject.toml', '**/uv.lock', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock', '**/ruff.toml', '.mise.toml', 'mise.lock') }}
        restore-keys: |
          ${{ runner.os }}-python-environment-
    - name: Cache Python packages
      if: steps.profile.outputs.python_dependencies == 'true' && hashFiles('**/pyproject.toml', '**/uv.lock', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock', '**/ruff.toml') != '' && steps.python-environment.outputs.cache-hit != 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.cache/uv
        key: ${{ runner.os }}-python-${{ hashFiles('**/pyproject.toml', '**/uv.lock', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock', '**/ruff.toml') }}
        restore-keys: |
          ${{ runner.os }}-python-
    - name: Cache Turborepo
      if: inputs.install == 'true' && steps.profile.outputs.turbo == 'true' && hashFiles('**/turbo.json', '**/turbo.jsonc') != ''
      uses: actions/cache@v5
      with:
        path: |
          .turbo/cache
          **/.turbo/cache
        key: ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/package.json', '**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json', '**/turbo.json', '**/turbo.jsonc', '.mise.toml', 'mise.lock') }}
        restore-keys: |
          ${{ runner.os }}-turbo-
    - name: Cache Rust packages
      id: rust-packages
      if: steps.profile.outputs.rust == 'true' && hashFiles('**/Cargo.toml', '**/Cargo.lock') != ''
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-
    - name: Cache Rust tools
      if: inputs.install != 'true' && steps.profile.outputs.rust == 'true' && hashFiles('**/Cargo.toml', '**/Cargo.lock') != ''
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin
        key: ${{ runner.os }}-rust-tools-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.mise.toml', 'mise.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-tools-
    - name: Cache Rust builds
      if: inputs.install == 'true' && steps.profile.outputs.rust == 'true' && hashFiles('**/Cargo.toml', '**/Cargo.lock') != ''
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-rust-build-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.mise.toml', 'mise.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-build-${{ github.workflow }}-${{ github.job }}-
    - name: Setup
      uses: jdx/mise-action@v4
      with:
        cache: true
    - name: Install
      if: inputs.install == 'true'
      shell: bash
      env:
        REPO_FOUNDRY_JAVASCRIPT_CACHE_HIT: ${{ steps.javascript-dependencies.outputs.cache-hit }}
        REPO_FOUNDRY_PYTHON_CACHE_HIT: ${{ steps.python-environment.outputs.cache-hit }}
        REPO_FOUNDRY_RUST_CACHE_HIT: ${{ steps.rust-packages.outputs.cache-hit }}
      run: bash .github/scripts/ci.sh install
