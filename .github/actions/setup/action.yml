name: Repository Setup
description: Install the pinned mise toolchain and optionally project dependencies.

inputs:
  install:
    description: Install dependencies for the detected project ecosystems.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Cache JavaScript packages
      if: hashFiles('**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json') != ''
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          ~/.npm
          ~/.cache/yarn
          ~/.local/share/pnpm/store
        key: ${{ runner.os }}-javascript-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-javascript-
    - name: Cache Rust packages
      if: hashFiles('**/Cargo.toml', '**/Cargo.lock') != ''
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-
    - name: Cache Rust builds
      if: hashFiles('**/Cargo.toml', '**/Cargo.lock') != ''
      uses: actions/cache@v4
      with:
        path: |
          target
          ~/.cargo/bin
        key: ${{ runner.os }}-rust-build-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.mise.toml') }}
        restore-keys: |
          ${{ runner.os }}-rust-build-${{ github.workflow }}-${{ github.job }}-
    - name: Cache Python packages
      if: hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock') != ''
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-python-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-python-
    - name: Cache installed JavaScript dependencies
      id: javascript-dependencies
      if: inputs.install == 'true' && hashFiles('**/package.json', '**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json', '**/.npmrc', '**/.yarnrc*', '**/.pnpmfile.cjs') != ''
      uses: actions/cache@v4
      with:
        path: |
          **/node_modules
        key: ${{ runner.os }}-javascript-installed-${{ hashFiles('**/package.json', '**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json', '**/.npmrc', '**/.yarnrc*', '**/.pnpmfile.cjs') }}
        restore-keys: |
          ${{ runner.os }}-javascript-installed-
    - name: Cache Python environment
      id: python-environment
      if: inputs.install == 'true' && hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock', '.mise.toml') != ''
      uses: actions/cache@v4
      with:
        path: |
          .venv
          **/.venv
        key: ${{ runner.os }}-python-environment-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock', '.mise.toml') }}
        restore-keys: |
          ${{ runner.os }}-python-environment-
    - name: Setup
      uses: jdx/mise-action@v4
      with:
        cache: true
    - name: Install
      if: inputs.install == 'true'
      shell: bash
      env:
        REPO_FOUNDRY_JAVASCRIPT_CACHE_HIT: ${{ steps.javascript-dependencies.outputs.cache-hit }}
        REPO_FOUNDRY_PYTHON_CACHE_HIT: ${{ steps.python-environment.outputs.cache-hit }}
      run: bash .github/scripts/ci.sh install
