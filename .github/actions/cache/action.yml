name: Repository Cache
description: Restore a cache and optionally enable the post-job save performed by actions/cache.

inputs:
  path:
    description: Cache paths.
    required: true
  key:
    description: Primary cache key.
    required: true
  restore-keys:
    description: Optional newline-delimited restore keys.
    required: false
    default: ''
  save:
    description: Enable cache saving after the job completes.
    required: false
    default: 'true'

outputs:
  cache-hit:
    description: Whether an exact cache was restored.
    value: ${{ steps.cache.outputs.cache-hit || steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # Caches are restored on every event but saved on push only: scheduled
    # and dispatched runs share the default branch with untrusted
    # runtime-ref checkouts, so letting them save would allow cache
    # poisoning. Push events require write access and stay trusted.
    - name: Restore cache
      id: restore
      if: inputs.save != 'true' || github.event_name != 'push'
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    - name: Restore and save cache
      id: cache
      if: inputs.save == 'true' && github.event_name == 'push'
      uses: actions/cache@v5
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
