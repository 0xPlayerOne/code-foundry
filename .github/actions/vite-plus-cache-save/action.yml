name: Save Vite+ task cache
description: Save the Vite+ task cache after repository tasks complete.

inputs:
  path:
    description: Cache paths; defaults to the contract published by the setup action.
    required: false
    default: ''
  key:
    description: Cache key; defaults to the contract published by the setup action.
    required: false
    default: ''
  save:
    description: Save intent; defaults to the aggregated setup-action contract.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Keep saving in a regular workflow step. A nested actions/cache post hook
    # inside the setup composite cannot reliably recover its original inputs.
    - name: Save Vite+ task cache
      if: >-
        !cancelled() &&
        github.event_name == 'push' &&
        (inputs.save == 'true' || (inputs.save != 'false' && env.CODE_FOUNDRY_VITE_CACHE_SAVE == 'true')) &&
        (inputs.path != '' || env.CODE_FOUNDRY_VITE_CACHE_PATHS != '') &&
        (inputs.key != '' || env.CODE_FOUNDRY_VITE_CACHE_KEY != '')
      uses: actions/cache/save@v5
      with:
        path: ${{ inputs.path || env.CODE_FOUNDRY_VITE_CACHE_PATHS }}
        key: ${{ inputs.key || env.CODE_FOUNDRY_VITE_CACHE_KEY }}
